openapi: 3.1.0
info:
  title: Sentinel API
  version: "2.0.0"
  summary: Client API for Sentinel Admin, Sentinel Operator and integrations.
  description: |
    Served by the management server under `/api/v2`. This document is the
    contract: every route here is implemented, and every `/api/v2` route the
    server answers is described here (checked by `TestOpenAPIMatchesRoutes`).

    ## Conventions

    - JSON bodies, `camelCase` keys, identifiers end in `Id` (`cameraId`).
    - Times are Unix **milliseconds** (`createdAt`, `from`, `to`, `expiresAt`).
    - Errors are always `{"error": {"code": "...", "message": "..."}}` with the
      HTTP status carrying the class. `message` is safe to show to a person.
    - Lists are `{"items": [...]}`; paged lists add `nextCursor` (pass it back
      as `cursor`; absent on the last page).
    - Request bodies reject unknown fields (`400 bad_request`).

    ## Authentication

    `POST /api/v2/auth/token` exchanges a name and password (or a refresh
    token) for an access token (15 minutes) and a rotating refresh token
    (30 days). Send `Authorization: Bearer <accessToken>`. Presenting a
    refresh token that was already rotated revokes the whole sign-in.

    The web dashboard's session cookie is accepted on every route too, so the
    same API serves the browser; cookie requests that change state must come
    from the same origin and send JSON (CSRF rules of `/api/v1`).

    ## Video

    Video bytes never use the API token. `POST /api/v2/cameras/{cameraId}/video-token`
    returns a short-lived **video token** and a `baseUrl` of the form
    `{recorderUrl}/v/{token}`. Append the video-plane paths to it:

    | Path | What |
    |---|---|
    | `/live/{cameraId}/index.m3u8` | live HLS (segments resolve relative to it) |
    | `/webrtc/{cameraId}/whep` | live WebRTC (WHEP, RFC 9725); `PATCH`/`DELETE` the returned `Location` |
    | `/api/v1/cameras/{cameraId}/playback.m3u8?from=&to=` | recorded HLS for a window (rights: `playback` or `export`) |
    | `/recordings/{cameraId}/{file}` | one recorded segment (rights: `playback` or `export`) |

    Absolute URIs in returned playlists and the WHEP `Location` already
    carry the `/v/{token}` prefix. Errors are the usual JSON: `401` for a
    malformed, forged or expired token, `403` when the path names another
    camera or needs a right the token lacks, `404` for any other path.

    In phase 1 `recorderUrl` is empty: the management server is the gateway.
    In phase 2 it is the recording server that holds the camera, which
    verifies the token offline. A token is bound to one camera and expires
    after at most 10 minutes; ask for a new one before `expiresAt`.

    Token format (`internal/videotoken`): `v1.<payload>.<signature>`, both
    unpadded base64url; payload is the JSON claims
    `{"cam","sub","rights":["live"|"playback"|"export"],"aud","iat","exp","jti"}`
    (`iat`/`exp` Unix seconds, `aud` = recording server id), signature is
    Ed25519 over the ASCII bytes `v1.<payload>`.

    ## Live events

    `GET /api/v2/events/stream` upgrades to a WebSocket that pushes
    `StreamMessage`s. Browsers can't set headers on a WebSocket, so it also
    accepts the session cookie, or the access token as the first message:
    `{"type":"auth","accessToken":"..."}` (must arrive within 10 s).
servers:
  - url: /
tags:
  - name: auth
  - name: events-stream
  - name: video
  - name: cameras
  - name: alarms
  - name: events
  - name: recordings
  - name: rules
  - name: users
  - name: servers
  - name: groups
  - name: security
  - name: audit
  - name: sso
  - name: directory
  - name: views
  - name: import
  - name: push
  - name: ptz
  - name: floorplans
  - name: evidence
  - name: incidents
  - name: system
  - name: bookmarks
  - name: export-jobs
  - name: export-schedules
  - name: zones
  - name: appearance
  - name: edge-recovery
  - name: talkback
  - name: device-codes
  - name: detection
  - name: faces
  - name: plates
  - name: semantic
  - name: wall-layouts
  - name: cloud
security:
  - bearer: []
  - session: []

paths:
  /api/v2/openapi.yaml:
    get:
      tags: [system]
      summary: This document.
      security: []
      responses:
        "200":
          description: OpenAPI 3.1 YAML.
          content:
            application/yaml: {}

  # ---------------------------------------------------------------- auth ---
  /api/v2/auth/token:
    post:
      tags: [auth]
      summary: Sign in, or refresh a sign-in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/PasswordGrant"
                - $ref: "#/components/schemas/RefreshGrant"
                - $ref: "#/components/schemas/OidcCodeGrant"
              discriminator:
                propertyName: grantType
      responses:
        "200":
          description: A new token pair.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/auth/revoke:
    post:
      tags: [auth]
      summary: Sign out this client (ends the refresh token's sign-in).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "204": { description: Signed out (also when the token was unknown). }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v2/me:
    get:
      tags: [auth]
      summary: The signed-in user and what they may do.
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ------------------------------------------------------- events stream ---
  /api/v2/events/stream:
    get:
      tags: [events-stream]
      summary: Live notifications over a WebSocket.
      description: |
        Upgrade to a WebSocket. The server sends `StreamMessage`s as text
        frames, a `hello` first. Optional `topics` query: comma-separated
        subset of `alarm,event,camera,config,servers,activity` (default all but
        `activity`, which is high-rate). The server pings every 30 s and
        closes with code 4401 when the sign-in ends (token expired or
        revoked: reconnect with a fresh token) and 4403 when the user may no
        longer view live video.

        Auth: a bearer header, else the session cookie (the upgrade's
        `Origin` must then match the host), else the first client message
        must be `{"type":"auth","accessToken":"..."}` within 10 s (failure
        closes with 4401). Other client messages are ignored. When a client
        falls behind, messages are dropped until it catches up, then one
        `lagged` is sent.
      parameters:
        - name: topics
          in: query
          schema: { type: string, example: "alarm,event,camera" }
      responses:
        "101": { description: Switching to the WebSocket protocol. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # --------------------------------------------------------------- video ---
  /api/v2/cameras/{cameraId}/video-token:
    post:
      tags: [video]
      summary: A short-lived token for one camera's video.
      description: |
        `live` needs ViewLive; `playback` ViewLive; `export` ExportEvidence.
        Audited for `playback` and `export` only (live view is not).
      parameters:
        - $ref: "#/components/parameters/CameraId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                rights:
                  type: array
                  items: { $ref: "#/components/schemas/VideoRight" }
                  default: [live]
                recorderId:
                  type: string
                  description: |
                    For footage recorded before the camera moved: the recording
                    server that has it (from Span.recorderId). Default: the
                    camera's current server. Only `playback`/`export` rights.
      responses:
        "200":
          description: The token and where to use it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoToken" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  # ------------------------------------------------------- phone cameras ---
  /api/v2/phone-cameras:
    post:
      tags: [cameras]
      summary: Add an iPhone camera (ManageCameras; Sentinel Cloud only, audited).
      description: |
        The phone pushes its video (see `POST /api/v2/cameras/{cameraId}/push-token`
        and the push protocol there). Answers the camera and its push key,
        shown this once: the phone keeps it in its Keychain. A site without
        a paid Sentinel Cloud plan (cloud or business, active or in grace)
        answers 402 `cloud_required`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string }
                location: { type: string }
                recorderId: { type: string, description: "recording server; default: the local one, else the only one" }
                recordingMode:
                  allOf: [{ $ref: "#/components/schemas/RecordingMode" }]
                  description: "default: default; dual is refused (no second stream)"
                groupIds: { type: array, items: { type: string } }
      responses:
        "201":
          description: The camera and its push key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhoneCameraCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/CloudRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v2/cameras/{cameraId}/push-key:
    post:
      tags: [cameras]
      summary: Rotate an iPhone camera's push key (ManageCameras, audited); the old key stops working at once.
      description: Push tokens already issued with the old key last until they expire (at most 5 minutes). Not gated by Sentinel Cloud.
      parameters:
        - $ref: "#/components/parameters/CameraId"
      responses:
        "200":
          description: The new key (shown once) and the camera.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhoneCameraCreated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [cameras]
      summary: Revoke an iPhone camera's push key (ManageCameras, audited); the phone can't stream until a new key is made.
      parameters:
        - $ref: "#/components/parameters/CameraId"
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v2/cameras/{cameraId}/push-token:
    post:
      tags: [video]
      summary: Trade an iPhone camera's push key for a push token (no user session; Sentinel Cloud only).
      description: |
        Send the key in the `X-Sentinel-Push-Key` header; no body. Answers a
        video token with the `push` right for this camera only, valid 5
        minutes (refresh at 4). Rate-limited per camera and per client
        (429). A wrong, rotated or revoked key answers 401; a site without a
        paid Sentinel Cloud plan 402 `cloud_required` (a session already
        streaming continues until its token expires).

        Push protocol, under `{baseUrl}` (the recording server directly, or
        `/v/{token}` here, which also works through Sentinel Cloud):

        - `POST {baseUrl}/push/{cameraId}/sessions` with
          `{"video": "h264"|"hevc", "width", "height", "fps", "audio": "aac"|null, "device"?}`
          answers `{"sessionId", "maxSegmentBytes": 8388608}`. A new session
          ends the camera's previous one.
        - `PUT {baseUrl}/push/{cameraId}/sessions/{sessionId}/init`: the fMP4
          init segment (ftyp + moov). Repeating the same init is fine; a
          different one answers 409.
        - `PUT {baseUrl}/push/{cameraId}/sessions/{sessionId}/segments/{seq}`:
          one media segment (moof + mdat), seq 0, 1, 2…, at most 8 MiB.
          204; a repeat of a received seq 204; more than 8 past the next
          expected answers 409 `{"error": {...}, "expected": n}` (before the
          init: expected 0). A missing seq is skipped after 3 s; no segment
          for 15 s ends the session (404 afterwards: start a new one).
        - `DELETE {baseUrl}/push/{cameraId}/sessions/{sessionId}`: stop (204).
      parameters:
        - $ref: "#/components/parameters/CameraId"
        - name: X-Sentinel-Push-Key
          in: header
          required: true
          schema: { type: string }
      security: []
      responses:
        "200":
          description: The push token and where to use it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/CloudRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }

  # ------------------------------------------------------------- cameras ---
  /api/v2/cameras:
    get:
      tags: [cameras]
      summary: All cameras the user may see, in display order, with live status.
      responses:
        "200":
          description: Cameras.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Camera" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [cameras]
      summary: Add a camera (ManageCameras).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Camera" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v2/cameras/{cameraId}:
    parameters:
      - $ref: "#/components/parameters/CameraId"
    get:
      tags: [cameras]
      summary: One camera.
      responses:
        "200":
          description: Camera.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Camera" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [cameras]
      summary: Change a camera (ManageCameras). Absent fields are kept.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraPatch" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Camera" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [cameras]
      summary: Remove a camera (ManageCameras). Its recordings are kept.
      responses:
        "204": { description: Removed. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------- recordings ---
  /api/v2/cameras/{cameraId}/timeline:
    get:
      tags: [recordings]
      summary: Recorded spans plus event and alarm markers for a window (≤ 26 h).
      parameters:
        - $ref: "#/components/parameters/CameraId"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Timeline.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Timeline" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/cameras/{cameraId}/recordings:
    get:
      tags: [recordings]
      summary: Recorded segment files, newest first.
      parameters:
        - $ref: "#/components/parameters/CameraId"
      responses:
        "200":
          description: Segments.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Segment" } }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  # ----------------------------------------------------------------- ptz ---
  /api/v2/cameras/{cameraId}/ptz:
    get:
      tags: [ptz]
      summary: Whether the camera has ONVIF PTZ, and its presets.
      description: Needs the controlPtz permission. Cameras on another recording server answer 502.
      parameters:
        - $ref: "#/components/parameters/CameraId"
      responses:
        "200":
          description: PTZ state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PTZState" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Unavailable" }
  /api/v2/cameras/{cameraId}/ptz/move:
    post:
      tags: [ptz]
      summary: Start a continuous move (velocities -1..1, clamped) until stop.
      parameters:
        - $ref: "#/components/parameters/CameraId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PTZMove" }
      responses:
        "200":
          description: The clamped velocities that were sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PTZMove" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Unavailable" }
  /api/v2/cameras/{cameraId}/ptz/stop:
    post:
      tags: [ptz]
      summary: Stop pan, tilt and zoom.
      parameters:
        - $ref: "#/components/parameters/CameraId"
      responses:
        "204": { description: Stopped. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Unavailable" }
  /api/v2/cameras/{cameraId}/ptz/presets:
    post:
      tags: [ptz]
      summary: Save the current position as a preset (audited).
      parameters:
        - $ref: "#/components/parameters/CameraId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "201":
          description: The new preset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PTZPreset" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Unavailable" }
  /api/v2/cameras/{cameraId}/ptz/presets/{token}/goto:
    post:
      tags: [ptz]
      summary: Move to a preset.
      parameters:
        - $ref: "#/components/parameters/CameraId"
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Moving. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Unavailable" }
  /api/v2/cameras/{cameraId}/ptz/presets/{token}:
    delete:
      tags: [ptz]
      summary: Delete a preset (audited).
      parameters:
        - $ref: "#/components/parameters/CameraId"
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Unavailable" }

  # -------------------------------------------------------------- alarms ---
  /api/v2/alarms:
    get:
      tags: [alarms]
      summary: Alarms, newest first.
      parameters:
        - name: state
          in: query
          schema: { type: string, enum: [open, all], default: open }
        - name: cameraId
          in: query
          schema: { type: string }
        - { name: states, in: query, schema: { type: string }, example: "New,Acknowledged", description: "Comma-separated alarm states; overrides `state`." }
        - { name: severities, in: query, schema: { type: string }, example: "Critical,Warning" }
        - { name: cameras, in: query, schema: { type: string }, description: "Comma-separated camera ids (within the caller's scope)." }
        - { name: owner, in: query, schema: { type: string }, description: "Exact owner name, or `unassigned`." }
        - { name: from, in: query, schema: { type: integer, format: int64 }, description: "Raised at or after, Unix ms." }
        - { name: to, in: query, schema: { type: integer, format: int64 }, description: "Raised before, Unix ms." }
        - { name: q, in: query, schema: { type: string }, description: "Case-insensitive substring over title and detail." }
        - { name: before, in: query, schema: { type: string }, description: "`nextCursor` from the previous page (same as `cursor`)." }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of alarms.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Alarm" } }
                  nextCursor: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v2/alarms/counts:
    get:
      tags: [alarms]
      summary: Alarm counts per state, for the Alarm Manager state chips.
      description: Takes the same filters as the list except `state`/`states`.
      parameters:
        - { name: severities, in: query, schema: { type: string } }
        - { name: cameras, in: query, schema: { type: string } }
        - { name: owner, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: integer, format: int64 } }
        - { name: to, in: query, schema: { type: integer, format: int64 } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200":
          description: Counts keyed by alarm state (every state present).
          content:
            application/json:
              schema:
                type: object
                required: [counts]
                properties:
                  counts: { type: object, additionalProperties: { type: integer } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v2/reports/activity:
    get:
      tags: [reports]
      summary: Event and alarm counts per camera, kind and hour (events) or severity (alarms) for a time range.
      description: Same permission and camera scope as the alarm and event lists. Range is at most 31 days; the default is the last 24 hours.
      parameters:
        - { name: from, in: query, schema: { type: integer, format: int64 } }
        - { name: to, in: query, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Activity for the range.
          content:
            application/json:
              schema:
                type: object
                required: [from, to, totals, events, alarms]
                properties:
                  from: { type: integer, format: int64 }
                  to: { type: integer, format: int64 }
                  totals:
                    type: object
                    required: [events, alarms]
                    properties:
                      events: { type: integer }
                      alarms: { type: integer }
                  events:
                    type: array
                    items:
                      type: object
                      required: [cameraId, kind, hour, count]
                      properties:
                        cameraId: { type: string }
                        kind: { type: string }
                        hour: { type: integer, format: int64, description: Start of the hour, Unix milliseconds }
                        count: { type: integer }
                  alarms:
                    type: array
                    items:
                      type: object
                      required: [cameraId, kind, severity, count]
                      properties:
                        cameraId: { type: string }
                        kind: { type: string }
                        severity: { type: string }
                        count: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v2/alarms/{alarmId}/events:
    get:
      tags: [alarms]
      summary: The detection events behind an alarm, oldest first.
      parameters:
        - $ref: "#/components/parameters/AlarmId"
      responses:
        "200":
          description: Events.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Event" } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v2/alarms/{alarmId}/assign:
    post:
      tags: [alarms]
      summary: Assign an alarm to a user (AcknowledgeAlarms).
      description: Sets the owner and appends to the response log. An empty owner unassigns.
      parameters:
        - $ref: "#/components/parameters/AlarmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner]
              additionalProperties: false
              properties:
                owner: { type: string, description: "A user name, or empty to unassign." }
      responses:
        "200":
          description: The updated alarm.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alarm" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v2/alarms/{alarmId}/severity:
    post:
      tags: [alarms]
      summary: Change an alarm's severity (AcknowledgeAlarms).
      description: How an operator accepts a triage suggestion; appends to the response log.
      parameters:
        - $ref: "#/components/parameters/AlarmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [severity]
              additionalProperties: false
              properties:
                severity: { type: string, enum: [Critical, Warning, Info] }
      responses:
        "200":
          description: The updated alarm.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alarm" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v2/alarms/{alarmId}/triage:
    post:
      tags: [alarms]
      summary: AI triage of an alarm (AcknowledgeAlarms).
      description: |
        One model call over the alarm and its events (counted against the daily
        AI limit). Advice only: nothing is applied until the operator changes the
        severity with `/severity`. 409 when AI is off, 429 at the daily limit.
      parameters:
        - $ref: "#/components/parameters/AlarmId"
      responses:
        "200":
          description: The model's read of the alarm.
          content:
            application/json:
              schema:
                type: object
                required: [summary, suggestedSeverity, rationale]
                properties:
                  summary: { type: string }
                  suggestedSeverity: { type: string, description: "Critical, Warning or Info; empty when the model gave none." }
                  rationale: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { description: The model call failed. }
  /api/v2/incidents:
    get:
      tags: [incidents]
      summary: Incidents, newest first.
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/IncidentStatus" } }
        - { name: q, in: query, schema: { type: string }, description: "Substring over title and summary." }
        - $ref: "#/components/parameters/Limit"
        - { name: before, in: query, schema: { type: string }, description: "`nextCursor` from the previous page." }
      responses:
        "200":
          description: A page of incidents.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Incident" } }
                  nextCursor: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [incidents]
      summary: Open an incident (AcknowledgeAlarms).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              additionalProperties: false
              properties:
                title: { type: string }
                severity: { $ref: "#/components/schemas/IncidentSeverity" }
      responses:
        "201":
          description: The incident.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v2/incidents/{id}:
    get:
      tags: [incidents]
      summary: One incident with its items resolved to live objects.
      description: |
        Items are in chronological order. An item whose camera is outside the
        caller's scope is `restricted` (no object, no ref); one whose object has
        been deleted is `missing`. Neither fails the request.
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "200":
          description: Incident and items.
          content:
            application/json:
              schema:
                type: object
                required: [incident, items]
                properties:
                  incident: { $ref: "#/components/schemas/Incident" }
                  items: { type: array, items: { $ref: "#/components/schemas/IncidentItem" } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [incidents]
      summary: Edit an incident (AcknowledgeAlarms).
      description: Status changes are audited.
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: { type: string }
                status: { $ref: "#/components/schemas/IncidentStatus" }
                severity: { $ref: "#/components/schemas/IncidentSeverity" }
                summary: { type: string }
      responses:
        "200":
          description: The incident.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v2/incidents/{id}/items:
    post:
      tags: [incidents]
      summary: Add an alarm, event, evidence case or note to an incident (AcknowledgeAlarms).
      description: The referenced object must exist within the caller's scope (404 otherwise); adding it twice is a 409.
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              additionalProperties: false
              properties:
                kind: { type: string, enum: [alarm, event, evidence, note] }
                refId: { type: string, description: "Alarm, event or evidence id; not for notes." }
                note: { type: string }
      responses:
        "201":
          description: The item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v2/incidents/{id}/items/{itemId}:
    delete:
      tags: [incidents]
      summary: Remove an item from an incident (AcknowledgeAlarms).
      parameters:
        - $ref: "#/components/parameters/IncidentId"
        - { name: itemId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v2/incidents/{id}/report:
    post:
      tags: [incidents]
      summary: Draft a markdown incident report into the summary (AcknowledgeAlarms).
      description: |
        One model call over the incident's chronology (counted against the daily
        AI limit). The draft replaces `summary` for the operator to edit; nothing
        is published. Restricted items are not shown to the model. 409 when AI is
        off, 429 at the daily limit.
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "200":
          description: The incident with the drafted summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { description: The model call failed. }
  /api/v2/alarms/{alarmId}:
    get:
      tags: [alarms]
      summary: One alarm.
      parameters:
        - $ref: "#/components/parameters/AlarmId"
      responses:
        "200":
          description: Alarm.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alarm" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v2/alarms/{alarmId}/state:
    post:
      tags: [alarms]
      summary: Change an alarm's state (AcknowledgeAlarms).
      parameters:
        - $ref: "#/components/parameters/AlarmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [state]
              properties:
                state: { $ref: "#/components/schemas/AlarmState" }
                note: { type: string, maxLength: 500 }
                snoozeMinutes: { type: integer, minimum: 1, maximum: 1440, description: "with state Snoozed; default 15" }
      responses:
        "200":
          description: Updated alarm.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alarm" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v2/alarms/{alarmId}/evidence:
    post:
      tags: [alarms]
      summary: Lock the recording behind an alarm as evidence (ExportEvidence). Idempotent.
      parameters:
        - $ref: "#/components/parameters/AlarmId"
      responses:
        "200":
          description: The evidence package.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Evidence" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ------------------------------------------------------------ evidence ---
  /api/v2/evidence:
    post:
      tags: [evidence]
      summary: Lock any camera and time range as evidence (ExportEvidence, audited).
      description: |
        Runs synchronously on the recording server holding the footage and
        answers when the clip is in its evidence vault. A range longer than
        the server's longest clip (30 minutes) answers 400 naming the limit.
        One case per camera; the web client loops for multi-camera selections.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cameraId, fromMs, toMs, title]
              properties:
                cameraId: { type: string }
                fromMs: { type: integer, format: int64, description: Unix ms }
                toMs: { type: integer, format: int64, description: Unix ms }
                title: { type: string, maxLength: 120 }
                note: { type: string, maxLength: 500 }
                watermark: { type: boolean, description: "Burn a watermark into the video (the server composes the text: requesting user, export time, case id for evidence; never client text). Re-encodes the clip." }
                blurRegions:
                  type: array
                  maxItems: 8
                  items: { $ref: "#/components/schemas/ExportRegion" }
                  description: Regions pixelated in the exported video (blocks of 16 px). Re-encodes the clip. Both options are recorded in the audit row.
      responses:
        "201":
          description: The new case.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceCase" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/Unavailable" }
    get:
      tags: [evidence]
      summary: Evidence cases, newest first, within the caller's camera scope (ExportEvidence).
      description: Includes cases locked from alarms (their fromMs/toMs are 0).
      responses:
        "200":
          description: The cases.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/EvidenceCase" } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v2/evidence/uploads:
    post:
      tags: [evidence]
      summary: Start uploading a video into the evidence vault (AcknowledgeAlarms; Sentinel Cloud only).
      description: |
        Declare the file, then PUT its parts (each `partSize` bytes, the
        last one the rest) and POST complete. Up to 4 GiB. Unfinished
        uploads are removed 24 hours after they start (`expiresAt`). An
        upload belongs to the user who started it. Every upload route
        answers 402 `cloud_required` without a paid Sentinel Cloud plan
        (videos uploaded earlier stay listed and downloadable).
        The camera defaults to the event's or alarm's; callers limited to
        some cameras must name one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fileName, size, sha256, contentType]
              properties:
                fileName: { type: string, maxLength: 255 }
                size: { type: integer, format: int64, minimum: 1, maximum: 4294967296 }
                sha256: { type: string, description: the whole file's SHA-256 in hex }
                contentType: { type: string, enum: [video/mp4, video/quicktime] }
                title: { type: string, maxLength: 120, description: "default: the file name without its extension" }
                note: { type: string, maxLength: 500 }
                recordedAt: { type: integer, format: int64, description: Unix ms the video was filmed }
                cameraId: { type: string }
                eventId: { type: string }
                alarmId: { type: string, description: "noted in the alarm's response log" }
                incidentId: { type: string, description: "the video is added to the incident as an evidence item" }
                device: { type: string, description: "the phone's name; default: the User-Agent's first product token" }
      responses:
        "201":
          description: Send the parts.
          content:
            application/json:
              schema:
                type: object
                required: [uploadId, partSize, partCount, expiresAt]
                properties:
                  uploadId: { type: string }
                  partSize: { type: integer, description: "8388608" }
                  partCount: { type: integer }
                  expiresAt: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/CloudRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v2/evidence/uploads/{uploadId}/parts/{n}:
    put:
      tags: [evidence]
      summary: One part of an upload (n from 0); sending a part again replaces it.
      description: |
        Body: the raw bytes (`application/octet-stream`), exactly `partSize`
        bytes except the last part. Cookie callers must also send the
        `X-Sentinel-Upload: 1` header.
      parameters:
        - { name: uploadId, in: path, required: true, schema: { type: string } }
        - { name: n, in: path, required: true, schema: { type: integer, minimum: 0 } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204": { description: Stored. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/CloudRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/BadRequest" }
  /api/v2/evidence/uploads/{uploadId}/complete:
    post:
      tags: [evidence]
      summary: Finish an upload, audited ("Uploaded video <title>").
      description: |
        Checks that every part is there, that the file's size and SHA-256
        match what was declared and that it starts with an `ftyp` box, then
        moves it into a recording server's evidence vault (the camera's,
        else the local one) and records it with `source: upload`. A large
        file may take longer than a minute: then the answer is 202
        `{"status": "processing"}`; call complete again for the result.
        A mismatch answers 400 and keeps the parts (send them again, or abort).
      parameters:
        - { name: uploadId, in: path, required: true, schema: { type: string } }
      responses:
        "201":
          description: The new evidence item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceCase" }
        "202":
          description: Still being filed; ask again.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [processing] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/CloudRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/evidence/uploads/{uploadId}:
    delete:
      tags: [evidence]
      summary: Abort an upload and drop its parts.
      parameters:
        - { name: uploadId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Aborted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/CloudRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v2/evidence/{evidenceId}/download:
    get:
      tags: [evidence]
      summary: The case's MP4 (ExportEvidence), served by the recording server holding it.
      description: Content-Disposition names the case ID; X-Content-SHA256 carries the recorded hash. Supports Range.
      parameters:
        - $ref: "#/components/parameters/EvidenceId"
      responses:
        "200":
          description: The clip.
          content:
            video/mp4:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v2/evidence/{evidenceId}/verify:
    post:
      tags: [evidence]
      summary: Recompute the file's SHA-256 on its recording server and compare (ExportEvidence, audited).
      parameters:
        - $ref: "#/components/parameters/EvidenceId"
      responses:
        "200":
          description: The result; ok is false when the file changed or is missing.
          content:
            application/json:
              schema:
                type: object
                required: [ok, sha256]
                properties:
                  ok: { type: boolean }
                  sha256: { type: string, description: the recomputed hash (empty if the file is missing) }
                  message: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v2/evidence/{evidenceId}:
    delete:
      tags: [evidence]
      summary: Release a case, deleting its file (ManageUsers, audited).
      parameters:
        - $ref: "#/components/parameters/EvidenceId"
      responses:
        "204": { description: Released. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/evidence/{evidenceId}/package:
    get:
      tags: [evidence]
      summary: A self-verifying evidence package, as a zip (ExportEvidence, audited).
      description: |
        The zip holds the media (`<case id>.mp4`), `manifest.json` (case id, camera, range, the vault's
        SHA-256 and size of the media, the audit entries that mention the case with their chain hashes,
        exporting user, created-at), `notes.txt` when the case has a note, and `player.html`, a fully
        offline page that plays the media and recomputes its SHA-256 (VERIFIED / TAMPERED / UNVERIFIED).
        `sentinel -verify-export <zip>` does the same on the command line (exit 0/1). A vault file that no
        longer matches its recorded hash is never packaged (409).
      parameters:
        - $ref: "#/components/parameters/EvidenceId"
      responses:
        "200":
          description: The package.
          headers:
            X-Content-SHA256: { schema: { type: string }, description: The media's recorded SHA-256. }
          content:
            application/zip:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/evidence/{evidenceId}/share:
    post:
      tags: [evidence]
      summary: Create an expiring share link to an evidence case (ExportEvidence, audited).
      description: |
        The one-time `url`/`token` are returned only here; the server keeps just the token's SHA-256.
        The public page `GET /share/{token}` is served on the LAN web origin only (never the tunnel):
        a minimal dark page with a video player and download button, Range supported. Expired,
        revoked, used-up and unknown tokens all answer one generic 410 page; token guesses are rate
        limited per IP (429). Opening the page counts one use; every access is audited with the remote IP.
      parameters:
        - $ref: "#/components/parameters/EvidenceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expiry]
              properties:
                expiry: { type: string, enum: ["1h", "24h", "7d", custom] }
                expiresAt: { type: integer, format: int64, description: "Unix ms; with expiry=custom, at most 30 days ahead." }
                maxUses: { type: integer, minimum: 0, maximum: 1000, description: 0 = unlimited within the expiry }
                note: { type: string, maxLength: 500 }
      responses:
        "201":
          description: The link, shown once.
          content:
            application/json:
              schema:
                type: object
                required: [link, token, url]
                properties:
                  link: { $ref: "#/components/schemas/ShareLink" }
                  token: { type: string, description: 32 random bytes, base64url }
                  url: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v2/share-links:
    get:
      tags: [evidence]
      summary: Share links, newest first, within the caller's camera scope (ExportEvidence).
      description: Includes expired and revoked links; never the token.
      responses:
        "200":
          description: The links with their use counts.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ShareLink" } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v2/share-links/{shareLinkId}:
    delete:
      tags: [evidence]
      summary: Revoke a share link (ExportEvidence, audited). Idempotent.
      parameters:
        - name: shareLinkId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Revoked. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --------------------------------------------- long & scheduled exports ---
  /api/v2/export-jobs:
    post:
      tags: [export-jobs]
      summary: Start a long (chunked) export of up to 12 hours (ExportEvidence, audited with the range).
      description: |
        The recording server holding the footage splits the range into
        keyframe-aligned pieces of at most 30 minutes, cuts each (stream
        copy) and joins them into one MP4. The call answers 201 as soon as
        the recording server accepted the job; progress shows in the tasks
        list (kind export) and in GET /api/v2/export-jobs/{taskId}. The
        recording server refuses up front (no recording in the range, less
        than twice the estimated size free on its disk, too many exports
        running). A range over 12 hours answers 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cameraId, fromMs, toMs, dest]
              properties:
                cameraId: { type: string }
                fromMs: { type: integer, format: int64, description: Unix ms }
                toMs: { type: integer, format: int64, description: Unix ms }
                dest: { type: string, enum: [download, evidence], description: "download keeps the file for 30 minutes after it is done; evidence files it in the vault" }
                title: { type: string, maxLength: 120, description: evidence title (dest evidence) }
                note: { type: string, maxLength: 500 }
                watermark: { type: boolean, description: "Burn a watermark into the video (the server composes the text: requesting user, export time, case id for evidence; never client text). Re-encodes the clip." }
                blurRegions:
                  type: array
                  maxItems: 8
                  items: { $ref: "#/components/schemas/ExportRegion" }
                  description: Regions pixelated in the exported video (blocks of 16 px). Re-encodes the clip. Both options are recorded in the audit row.
      responses:
        "201":
          description: The running job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/export-jobs/{taskId}:
    get:
      tags: [export-jobs]
      summary: A long export job's state and result (ExportEvidence; the user who started it).
      description: Jobs the scheduler started are visible to everyone with the permission. A finished job is kept for an hour.
      parameters:
        - $ref: "#/components/parameters/ExportTaskId"
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportJob" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [export-jobs]
      summary: Cancel a running long export (ExportEvidence, audited); its temp pieces are removed.
      description: Answers with the job once it has stopped. Cancelling a finished job changes nothing.
      parameters:
        - $ref: "#/components/parameters/ExportTaskId"
      responses:
        "200":
          description: The job, state canceled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportJob" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v2/export-jobs/{taskId}/download:
    get:
      tags: [export-jobs]
      summary: The MP4 of a finished download-destination job (ExportEvidence; the user who started it).
      description: Kept for 30 minutes after the job finished. Content-Disposition names the file; X-Content-SHA256 carries the hash. Supports Range.
      parameters:
        - $ref: "#/components/parameters/ExportTaskId"
      responses:
        "200":
          description: The clip.
          content:
            video/mp4:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v2/export-schedules:
    get:
      tags: [export-schedules]
      summary: Scheduled exports within the caller's camera scope (ExportEvidence).
      responses:
        "200":
          description: The schedules.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ExportSchedule" } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [export-schedules]
      summary: Add a scheduled export (ExportEvidence, audited).
      description: |
        When a window ends the server exports it into the evidence vault as a
        long export. Windows that end while the server is down are not
        backfilled. A window can cover at most 12 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, cameraId, days, start, end]
              properties:
                name: { type: string, maxLength: 100 }
                cameraId: { type: string }
                days: { type: array, items: { type: integer, minimum: 0, maximum: 6 } }
                start: { type: string, description: HH:MM }
                end: { type: string, description: HH:MM or 24:00 }
                dest: { type: string, enum: [evidence] }
                enabled: { type: boolean, description: defaults to true }
      responses:
        "201":
          description: The new schedule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportSchedule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v2/export-schedules/{scheduleId}:
    patch:
      tags: [export-schedules]
      summary: Change a scheduled export; omitted fields keep their value (ExportEvidence, audited).
      parameters:
        - $ref: "#/components/parameters/ExportScheduleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                cameraId: { type: string }
                days: { type: array, items: { type: integer, minimum: 0, maximum: 6 } }
                start: { type: string }
                end: { type: string }
                dest: { type: string, enum: [evidence] }
                enabled: { type: boolean }
      responses:
        "200":
          description: The schedule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportSchedule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [export-schedules]
      summary: Delete a scheduled export (ExportEvidence, audited).
      parameters:
        - $ref: "#/components/parameters/ExportScheduleId"
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # -------------------------------------------------------------- events ---
  /api/v2/events:
    get:
      tags: [events]
      summary: Detection events, newest first.
      parameters:
        - name: cameraId
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of events.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Event" } }
                  nextCursor: { type: string }
  /api/v2/events/search:
    get:
      tags: [events]
      summary: Forensic search over detection events, newest first.
      description: |
        Every filter is optional and they combine with AND; list filters
        (`cameras`, `kinds`, `labels`, `threats`) are comma-separated and match
        any value. `q` is a case-insensitive substring match over label,
        description and tags. Cameras outside the caller's scope are left out.
        Page with `before` = the previous page's `nextCursor`.
      parameters:
        - { name: cameras, in: query, schema: { type: string }, description: "Comma-separated camera ids." }
        - { name: kinds, in: query, schema: { type: string }, example: "Person,Vehicle" }
        - { name: labels, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: integer, format: int64 }, description: "Unix ms, inclusive." }
        - { name: to, in: query, schema: { type: integer, format: int64 }, description: "Unix ms, exclusive." }
        - { name: minScore, in: query, schema: { type: number, minimum: 0, maximum: 1 } }
        - { name: threats, in: query, schema: { type: string }, example: "elevated,high" }
        - { name: anomaly, in: query, schema: { type: boolean } }
        - { name: q, in: query, schema: { type: string } }
        - { name: plate, in: query, schema: { type: string }, description: "normalized plate text; a prefix matches (wave16-plates)" }
        - { name: person, in: query, schema: { type: string }, description: "a personId (wave16-faces)" }
        - { name: track, in: query, schema: { type: string }, description: "a trackId: the detections of one object (wave16-tracking)" }
        - $ref: "#/components/parameters/Limit"
        - { name: before, in: query, schema: { type: string }, description: "`nextCursor` from the previous page." }
      responses:
        "200":
          description: A page of matching events.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Event" } }
                  nextCursor: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v2/events/facets:
    get:
      tags: [events]
      summary: Event counts by kind, label and threat, for the search filter bar.
      parameters:
        - { name: cameras, in: query, schema: { type: string }, description: "Comma-separated camera ids." }
        - { name: from, in: query, schema: { type: integer, format: int64 } }
        - { name: to, in: query, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Counts, most frequent first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventFacets" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v2/events/ask:
    post:
      tags: [events]
      summary: Search events with a natural-language question.
      description: |
        One model call translates the question into a filter (counted against
        the daily AI limit); the search itself runs locally. 409 when AI is
        off, 429 when the daily limit is reached.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              additionalProperties: false
              properties:
                query: { type: string, example: "someone in a red jacket at the front door last night" }
      responses:
        "200":
          description: The filter the question was understood as, and its first page.
          content:
            application/json:
              schema:
                type: object
                required: [filter, items]
                properties:
                  filter: { $ref: "#/components/schemas/EventSearchFilter" }
                  items: { type: array, items: { $ref: "#/components/schemas/Event" } }
                  nextCursor: { type: string, description: "Pass as `before` to /events/search with the same filter." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { description: The model call failed. }
  /api/v2/events/{eventId}:
    get:
      tags: [events]
      summary: One event.
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Event.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v2/events/{eventId}/thumbnail.jpg:
    get:
      tags: [events]
      summary: The event's snapshot.
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: JPEG.
          content:
            image/jpeg: {}
        "404": { $ref: "#/components/responses/NotFound" }

  # --------------------------------------------------------------- rules ---
  /api/v2/rules:
    get:
      tags: [rules]
      summary: Alarm rules.
      responses:
        "200":
          description: Rules.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Rule" } }
    post:
      tags: [rules]
      summary: Create a rule (ChangeSettings).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuleInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v2/rules/draft:
    post:
      tags: [rules]
      summary: Draft an alarm rule from a plain-English description (ChangeSettings). Nothing is saved; the draft comes back with enabled false.
      description: |
        One model call turns the text into a rule draft and counts against the daily AI limit. The server resolves
        camera and time profile names to ids and validates the result the same way a saved rule is validated. The
        model receives only the text, the camera names, the alarm kinds, the time profile names and the server's
        local time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              additionalProperties: false
              properties:
                text: { type: string, minLength: 3, maxLength: 500, example: "tell me about people at the loading dock after 6pm" }
      responses:
        "200":
          description: The draft, a one-sentence explanation and anything the server could not resolve.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuleDraft" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { description: The model call failed. }
  /api/v2/rule-templates:
    get:
      tags: [rules]
      summary: Ready-made alarm rules to start from (ViewLive). Static list; nothing is created until a template is saved as a rule.
      responses:
        "200":
          description: Templates.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RuleTemplate" } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v2/insights:
    get:
      tags: [reports]
      summary: Trends and recommendations for a time range (ViewLive; camera scope applies). No AI call.
      description: |
        Range is at most 31 days; the default is the last 7 days. Days are local server days. Camera scope is the
        same as the activity report's.
      parameters:
        - { name: from, in: query, schema: { type: integer, format: int64 }, description: "Unix ms." }
        - { name: to, in: query, schema: { type: integer, format: int64 }, description: "Unix ms." }
      responses:
        "200":
          description: Insights for the range.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Insights" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v2/rules/{ruleId}:
    parameters:
      - name: ruleId
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [rules]
      summary: Replace a rule (ChangeSettings).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuleInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [rules]
      summary: Delete a rule (ChangeSettings).
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --------------------------------------------------------------- users ---
  /api/v2/users:
    get:
      tags: [users]
      summary: Users (ManageUsers).
      responses:
        "200":
          description: Users.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/User" } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [users]
      summary: Create a user (ManageUsers).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, role, password]
              properties:
                name: { type: string }
                role: { $ref: "#/components/schemas/Role" }
                password: { type: string, minLength: 8 }
                scope: { $ref: "#/components/schemas/UserScope" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v2/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [users]
      summary: Change a user's role or password (ManageUsers). Signs them out everywhere.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                role: { $ref: "#/components/schemas/Role" }
                password: { type: string, minLength: 8, description: local users only (409 for directory users) }
                scope: { $ref: "#/components/schemas/UserScope" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [users]
      summary: Delete a user (ManageUsers). The last Admin can't be deleted.
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # -------------------------------------------------------------- system ---
  /api/v2/recording-servers:
    get:
      tags: [servers]
      summary: Recording servers and their health, the local one first.
      responses:
        "200":
          description: Recording servers.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RecordingServer" } }

  /api/v2/recording-servers/{serverId}:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    get:
      tags: [servers]
      summary: One recording server.
      responses:
        "200":
          description: Recording server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordingServer" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [servers]
      summary: Rename a recording server or set where clients reach it (ManageCameras).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                publicUrl: { type: string, description: 'base URL of its video plane, e.g. "https://rs2.lan:8090"; "" = through the management server' }
                recordingsDir: { type: string, maxLength: 1000, description: 'where that server keeps its recordings: an absolute path on it, e.g. "/mnt/video"; "" = <its data directory>/recordings. A connected server switches at once and moves its existing recordings there in the background; an offline one switches when it reconnects. The local server refuses a folder it cannot write to (400).' }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordingServer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [servers]
      summary: Revoke a recording server (ManageCameras). Its certificate is refused from now on and it is disconnected; its cameras stay assigned until moved. The local server can't be revoked (409). With remove=true a revoked server is taken out of the registry instead (409 while it still has cameras or is not revoked yet); its past placements and evidence keep its id.
      parameters:
        - in: query
          name: remove
          schema: { type: boolean, default: false }
          description: remove a revoked server from the registry instead of revoking
      responses:
        "204": { description: Revoked, or removed. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v2/recording-servers/enrollment-tokens:
    post:
      tags: [servers]
      summary: A one-time token to enroll a new recording server (ManageCameras). Valid 1 hour, shown once.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 100, description: name the new server gets }
      responses:
        "201":
          description: The token and the command to run on the new machine.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentToken" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v2/recording-servers/{serverId}/log:
    get:
      tags: [servers]
      summary: The recent system log of a recording server, fetched over the control link (ViewAudit, and access to every camera; 403 for group-scoped users). Secrets are stripped.
      parameters:
        - $ref: "#/components/parameters/ServerId"
        - name: lines
          in: query
          schema: { type: integer, minimum: 1, maximum: 2000, default: 300 }
      responses:
        "200":
          description: Log lines, oldest first.
          content:
            text/plain: {}
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v2/system/health:
    get:
      tags: [servers]
      summary: System Monitor feed (ViewLive). Every recording server with CPU, memory, recordings-disk, database size, uptime and version, plus per-camera health. Camera rows follow the caller's scope. Connected servers are queried in parallel with a short timeout; an offline one still appears with online false, null metrics and its last-known cameras.
      responses:
        "200":
          description: Health of every recording server.
          content:
            application/json:
              schema:
                type: object
                required: [servers]
                properties:
                  servers: { type: array, items: { $ref: "#/components/schemas/ServerHealth" } }

  /api/v2/site:
    get:
      tags: [system]
      summary: Site information (ViewLive). Name, description and contact, empty strings until set. The admin tree's root title.
      responses:
        "200":
          description: The site information.
          content: { application/json: { schema: { $ref: "#/components/schemas/SiteInfo" } } }
    put:
      tags: [system]
      summary: Replace the site information (ChangeSettings, audited). Name up to 80 characters, description 500, contact 200.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SiteInfo" } } }
      responses:
        "200":
          description: The stored site information.
          content: { application/json: { schema: { $ref: "#/components/schemas/SiteInfo" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v2/system/thresholds:
    get:
      tags: [system]
      summary: "System Monitor thresholds (ViewAudit: whoever sees Health). Percent at which CPU, memory and disk turn amber and red; defaults 80 and 95."
      responses:
        "200":
          description: The thresholds.
          content: { application/json: { schema: { $ref: "#/components/schemas/MonitorThresholds" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [system]
      summary: Replace the monitor thresholds (ChangeSettings, audited). Each metric needs 1 <= amber < red <= 100.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MonitorThresholds" } } }
      responses:
        "200":
          description: The stored thresholds.
          content: { application/json: { schema: { $ref: "#/components/schemas/MonitorThresholds" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v2/settings/recording:
    get:
      tags: [system]
      summary: "Server-wide recording defaults (ViewLive): the mode, trigger and pre/post-roll of cameras set to default, retention and the free-space floor."
      responses:
        "200":
          description: The settings.
          content: { application/json: { schema: { $ref: "#/components/schemas/RecordingSettings" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [system]
      summary: "Change the recording defaults (ChangeSettings, audited); only the fields sent change. Every recording server gets the new configuration."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RecordingSettingsPatch" } } }
      responses:
        "200":
          description: The stored settings.
          content: { application/json: { schema: { $ref: "#/components/schemas/RecordingSettings" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v2/system/tasks:
    get:
      tags: [system]
      summary: Current Tasks (ViewAudit). Running long operations (camera discovery, evidence export, Mac import) and those finished in the last 15 minutes, newest first. In memory on the management server; a restart forgets them.
      responses:
        "200":
          description: The tasks.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/SystemTask" } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v2/system/logs:
    get:
      tags: [system]
      summary: Server Logs (ViewAudit, and access to every camera; 403 for group-scoped users). The tail of one server's in-memory log ring (secrets stripped), oldest first. A remote recording server answers over the control link (503 when it can't). format=text downloads the same lines as plain text.
      parameters:
        - { name: server, in: query, schema: { type: string, default: local }, description: Recording server id; "local" is the management server's own process. }
        - { name: level, in: query, schema: { type: string, enum: [debug, info, warn, error] }, description: Least severe level to include. }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 2000, default: 300 } }
        - { name: format, in: query, schema: { type: string, enum: [json, text], default: json } }
      responses:
        "200":
          description: The log lines.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerLogs" }
            text/plain:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v2/system/config-report:
    get:
      tags: [system]
      summary: Configuration report (ChangeSettings, audited). A snapshot of servers, cameras, groups, users, roles, rules, time profiles, webhooks, site info and versions. Every credential, password hash and secret is redacted (camera and webhook entries only say whether one is set). format=html returns a printable page.
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [json, html], default: json } }
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigReport" }
            text/html:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v2/recording-servers/{serverId}/discover:
    post:
      tags: [servers]
      summary: Scan the recording server's LAN for cameras (ManageCameras). ONVIF WS-Discovery always, plus a TCP sweep of its subnets with {"sweep":true}. A remote server scans over the control link. One scan per server at a time (409).
      parameters:
        - $ref: "#/components/parameters/ServerId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                sweep: { type: boolean, default: false }
      responses:
        "200":
          description: Devices found on that server's network.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoverResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v2/recording-servers/{serverId}/discover/probe:
    post:
      tags: [servers]
      summary: Sign in to one camera over ONVIF from the recording server and return its streams (ManageCameras). A camera that can't be reached or refuses the login is reported inside the 200 body, not as an API error.
      parameters:
        - $ref: "#/components/parameters/ServerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [host]
              properties:
                host: { type: string, description: the camera's IP address or hostname }
                serviceURL: { type: string, description: its ONVIF device service, when discovery reported one; http(s) on the same host }
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: The camera's streams, or why it couldn't be probed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProbeOutcome" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  # -------------------------------------------------------------- groups ---
  /api/v2/camera-groups:
    get:
      tags: [groups]
      summary: Camera groups. Users scoped to groups see only their own groups.
      responses:
        "200":
          description: Groups.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/CameraGroup" } }
    post:
      tags: [groups]
      summary: Create a group (ManageCameras).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraGroupInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraGroup" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v2/camera-groups/{groupId}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [groups]
      summary: Rename a group and set its cameras (ManageCameras).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraGroupInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraGroup" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [groups]
      summary: Delete a group (ManageCameras). Users scoped only to it then see no cameras.
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --------------------------------------- time profiles and webhooks (wave 6) ---
  /api/v2/time-profiles:
    get:
      tags: [rules]
      summary: Time profiles, by name (ChangeSettings).
      responses:
        "200":
          description: Profiles.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/TimeProfile" } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [rules]
      summary: Create a time profile (ChangeSettings).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TimeProfileInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v2/time-profiles/{profileId}:
    parameters:
      - name: profileId
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [rules]
      summary: Replace a time profile (ChangeSettings).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TimeProfileInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [rules]
      summary: Delete a time profile (ChangeSettings). 409 while a rule references it.
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v2/webhooks:
    get:
      tags: [rules]
      summary: Webhooks (ChangeSettings). Secrets are never returned, only `hasSecret`.
      responses:
        "200":
          description: Webhooks.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Webhook" } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [rules]
      summary: Create a webhook (ChangeSettings).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v2/webhooks/{webhookId}:
    parameters:
      - name: webhookId
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [rules]
      summary: Replace a webhook (ChangeSettings). An absent `secret` keeps the stored one; "" clears it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [rules]
      summary: Delete a webhook (ChangeSettings). 409 while a rule has an action for it.
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v2/webhooks/{webhookId}/test:
    parameters:
      - name: webhookId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [rules]
      summary: Send one signed `webhook.test` delivery now (ChangeSettings), without retries.
      responses:
        "200":
          description: "How the delivery went (an unreachable endpoint is `ok: false`, not an error)."
          content:
            application/json:
              schema:
                type: object
                required: [ok, status]
                properties:
                  ok: { type: boolean }
                  status: { type: string, description: 'e.g. "ok (200)", "failed: HTTP 500"' }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ----------------------------------------------------- stream settings ---
  /api/v2/cameras/{cameraId}/stream-settings:
    get:
      tags: [cameras]
      summary: The camera's encoder configurations (per stream) and the ranges it accepts.
      description: >
        Needs manageCameras. Asked of the camera itself over ONVIF (through the
        camera's recording server when it is remote). A range whose max is 0 was
        not reported by the camera: treat it as unbounded. 409 when the camera
        was added without ONVIF; 502 when the camera or its recording server
        can't be reached.
      parameters:
        - $ref: "#/components/parameters/CameraId"
      responses:
        "200":
          description: The streams.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreamSettings" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/Unavailable" }
  /api/v2/cameras/{cameraId}/stream-settings/{configToken}:
    put:
      tags: [cameras]
      summary: Change one stream's resolution, frame rate, bitrate, keyframe interval or quality (audited).
      description: >
        Needs manageCameras. Zero-valued fields keep the camera's current value;
        values outside the ranges from GET are rejected with 400. The live
        stream may briefly reconnect. A camera that refuses the change answers
        502 with its own error text.
      parameters:
        - $ref: "#/components/parameters/CameraId"
        - { name: configToken, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StreamSettingsChange" }
      responses:
        "204": { description: Applied. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/Unavailable" }
  /api/v2/cameras/{cameraId}/streams/discover:
    post:
      tags: [cameras]
      summary: Find the camera's streams and recommend a second (low-res) one.
      description: >
        Needs manageCameras. Runs on the camera's recording server: ONVIF
        first (saved ONVIF address, else the usual ports on the camera's
        host); when that shows no extra H.264/H.265 stream, addresses guessed
        from the main one (stream1→stream2, /101→/102, subtype=0→1,
        main→sub, profile1→profile2, ch0_0→ch0_1, av0_0→av0_1) are kept only
        if they answer RTSP DESCRIBE with a video track (2 s each, at most
        6). Uses the camera's saved login unless the body gives one. Stream
        addresses never carry credentials. 422 when the camera rejects the
        login (code camera_auth, authFailed true) or can't be reached
        (camera_unreachable).
      parameters:
        - $ref: "#/components/parameters/CameraId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StreamsDiscoverRequest" }
      responses:
        "200":
          description: The streams found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreamDiscovery" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: The camera rejected the login or couldn't be reached.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraStreamError" }
        "502": { $ref: "#/components/responses/Unavailable" }
  /api/v2/cameras/{cameraId}/streams/resize:
    post:
      tags: [cameras]
      summary: Change one stream's resolution over ONVIF, e.g. a too-small second stream to 1280×720 (audited).
      description: >
        Needs manageCameras. encoderToken comes from a discovered stream
        (tooSmallSub or streams[].encoderToken). Validated against the
        camera's own ranges like stream-settings (400 when it doesn't offer
        the size). 409 when the camera was added without ONVIF; 502 when the
        camera or its recording server refuses or can't be reached.
      parameters:
        - $ref: "#/components/parameters/CameraId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StreamResize" }
      responses:
        "200":
          description: The stream as the camera now reports it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FoundStream" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/Unavailable" }

  # ---------------------------------------------------------- floorplans ---
  /api/v2/floorplans:
    get:
      tags: [floorplans]
      summary: Floorplans with their camera pins. Pins on cameras outside the caller's scope are left out; a plan with no visible pins is still listed.
      responses:
        "200":
          description: Floorplans.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Floorplan" } }
    post:
      tags: [floorplans]
      summary: Upload a floorplan (ManageCameras). PNG, JPEG or WebP, up to 8 MB; the type is sniffed from the content.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, image]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                image: { type: string, format: binary }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Floorplan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413":
          description: The image is larger than 8 MB.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "415":
          description: The file is not a PNG, JPEG or WebP image.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /api/v2/floorplans/{planId}:
    parameters:
      - name: planId
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [floorplans]
      summary: Rename a floorplan or change its order (ManageCameras).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FloorplanPatch" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Floorplan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [floorplans]
      summary: Delete a floorplan and its pins (ManageCameras).
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v2/floorplans/{planId}/image:
    parameters:
      - name: planId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [floorplans]
      summary: The floorplan image (ETag; send If-None-Match to get 304).
      responses:
        "200":
          description: The image.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "304": { description: Not modified. }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v2/floorplans/{planId}/pins:
    parameters:
      - name: planId
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [floorplans]
      summary: Replace all pins on a floorplan (ManageCameras).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/FloorplanPin" }
      responses:
        "200":
          description: The floorplan with its new pins.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Floorplan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ----------------------------------------------------------- bookmarks ---
  /api/v2/cameras/{cameraId}/bookmarks:
    parameters:
      - $ref: "#/components/parameters/CameraId"
    get:
      tags: [bookmarks]
      summary: A camera's timeline bookmarks overlapping a window, oldest first. A camera outside the caller's scope is 404.
      parameters:
        - name: from
          in: query
          description: window start, Unix ms (omit for no lower bound)
          schema: { type: integer, format: int64, minimum: 0 }
        - name: to
          in: query
          description: window end, Unix ms (omit for no upper bound)
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        "200":
          description: Bookmarks.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Bookmark" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [bookmarks]
      summary: Pin a moment (durationMs 0) or a range on the camera's timeline. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookmarkInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bookmark" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v2/bookmarks/{bookmarkId}:
    parameters:
      - name: bookmarkId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [bookmarks]
      summary: Edit a bookmark. Only its author, or a manager (a role that can manage cameras or read the audit trail), may. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookmarkPatch" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bookmark" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [bookmarks]
      summary: Delete a bookmark. Only its author, or a manager, may. Audited.
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --------------------------------------------------------------- audit ---
  /api/v2/audit:
    get:
      tags: [audit]
      summary: The site's audit log, newest first (ViewAudit, and access to every camera; 403 for group-scoped users). Includes entries forwarded by recording servers.
      parameters:
        - name: serverId
          in: query
          description: only entries from this recording server ("" = the management server's own)
          schema: { type: string }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of entries.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
                  nextCursor: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v2/audit/verify:
    get:
      tags: [audit]
      summary: Verify the hash chains (ViewAudit).
      responses:
        "200":
          description: Result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditVerify" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ----------------------------------------------------------- directory ---
  /api/v2/auth/providers:
    get:
      tags: [sso]
      summary: How users can sign in here (for sign-in screens).
      security: []
      responses:
        "200":
          description: Providers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthProviders" }
  /api/v2/auth/oidc/start:
    get:
      tags: [sso]
      summary: Start single sign-on (OIDC authorization code + PKCE). Redirects to the identity provider.
      description: |
        Web: open it in the browser; after sign-in the server sets the
        session cookie and redirects to `returnTo` (a path on this server,
        default `/`). Native clients pass `redirectUri` (a loopback
        `http://127.0.0.1:<port>/...` URL or a `sentinel-operator:` URL); the
        server redirects there with `?code=` (one-time, 60 s), which the
        client exchanges with grantType `oidc_code`.
      security: []
      parameters:
        - name: returnTo
          in: query
          schema: { type: string }
        - name: redirectUri
          in: query
          schema: { type: string }
        - name: state
          in: query
          description: echoed back to redirectUri
          schema: { type: string }
      responses:
        "302": { description: To the identity provider. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v2/auth/oidc/callback:
    get:
      tags: [sso]
      summary: Where the identity provider returns (not called by clients).
      description: |
        Refusals after a valid flow (user not mapped to a role, provider
        error, name taken) redirect rather than answer: the web flow to
        `/?ssoError=<message>`, the native flow to
        `redirectUri?error=access_denied&error_description=…&state=…`.
        An unknown, used or foreign flow is 400.
      security: []
      responses:
        "302": { description: To returnTo or redirectUri. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v2/directory:
    get:
      tags: [directory]
      summary: Directory sign-in settings (ChangeSettings). Secrets are never returned.
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectorySettings" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [directory]
      summary: Save directory sign-in settings (ChangeSettings). Absent secrets are kept.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DirectorySettings" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectorySettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v2/directory/test:
    post:
      tags: [directory]
      summary: Try LDAP settings with a user's name and password without saving (ChangeSettings).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [settings, name, password]
              properties:
                settings: { $ref: "#/components/schemas/LDAPSettings" }
                name: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Outcome.
          content:
            application/json:
              schema:
                type: object
                required: [ok, message]
                properties:
                  ok: { type: boolean }
                  message: { type: string }
                  role: { $ref: "#/components/schemas/Role" }
                  groups: { type: array, items: { type: string } }
        "403": { $ref: "#/components/responses/Forbidden" }

  # --------------------------------------------------------------- views ---
  /api/v2/views:
    get:
      tags: [views]
      summary: The user's saved views (camera layouts).
      responses:
        "200":
          description: Views.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/View" } }
    post:
      tags: [views]
      summary: Save a view.
      description: |
        With `shared: true` the view joins the Shared tree, optionally in a
        folder (`groupId`); that, and changing or deleting any shared view,
        needs ManageViews (403 otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ViewInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/View" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v2/views/{viewId}:
    parameters:
      - name: viewId
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [views]
      summary: Replace a view.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ViewInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/View" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [views]
      summary: Delete a view.
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v2/view-groups:
    get:
      tags: [views]
      summary: The Shared tree - every folder and every shared view.
      description: |
        Folders come flat with `parentId` ("" = top level); the client nests
        them. Shared views carry `groupId`, `sortOrder` and `shared: true`.
        The caller's private views stay on `GET /views`. A shared view's
        layout is not filtered by camera scope; a viewer without access to
        one of its cameras sees a "no access" tile.
      responses:
        "200":
          description: The Shared tree.
          content:
            application/json:
              schema:
                type: object
                required: [groups, views]
                properties:
                  groups: { type: array, items: { $ref: "#/components/schemas/ViewGroup" } }
                  views: { type: array, items: { $ref: "#/components/schemas/View" } }
    post:
      tags: [views]
      summary: Create a folder in the Shared tree (ManageViews, audited).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ViewGroupInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ViewGroup" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v2/view-groups/{groupId}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [views]
      summary: Rename, move or reorder a folder (ManageViews, audited).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ViewGroupInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ViewGroup" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [views]
      summary: Delete an empty folder (ManageViews, audited).
      description: 409 while the folder still holds folders or views.
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # -------------------------------------------------------------- import ---
  /api/v2/import/mac:
    post:
      tags: [import]
      summary: Import a Sentinel for Mac (1.x) installation (Admin). Idempotent by source ids.
      description: |
        Sent by Sentinel Operator for macOS on first launch after the upgrade.
        Cameras go to the local recording server (409 if there is none).
        Imported audit entries are appended to the chain with their original
        time in the detail. Evidence files follow with PUT .../evidence/{caseId}.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MacImport" }
      responses:
        "200":
          description: What was imported.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MacImportResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v2/import/mac/evidence/{caseId}:
    put:
      tags: [import]
      summary: Upload one imported evidence file (Admin). Body is the MP4; must match the sha256 from the import.
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream: {}
      responses:
        "204": { description: Stored in the local recording server's evidence vault. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ---------------------------------------------------------------- push ---
  /api/v2/push/registration:
    put:
      tags: [push]
      summary: Register this phone's APNs device token for the signed-in user (ViewLive).
      description: |
        Alarms are pushed to the phone only for cameras the user may see.
        Idempotent: registering a token that is already known updates its
        owner and name (a phone that signs in as someone else takes it over).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [apnsToken]
              properties:
                apnsToken: { type: string, description: "device token, hex (32-200 characters)" }
                deviceName: { type: string, maxLength: 80, description: "shown in the dashboard's device list, e.g. an iPhone's name" }
      responses:
        "204": { description: Registered. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [push]
      summary: Stop pushing to a device token (sign-out). Only the owner's registration is removed.
      parameters:
        - name: apnsToken
          in: query
          required: true
          schema: { type: string }
      responses:
        "204": { description: Removed (also when it wasn't registered). }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v2/push/activity-token:
    put:
      tags: [push]
      summary: Follow an alarm with a Live Activity on this phone (ViewLive).
      description: |
        Hands the server the ActivityKit push token of the alarm Live
        Activity the phone runs. While it is set, each state change of that
        alarm is pushed to the phone as an APNs `liveactivity` push
        (`event: update`, or `end` once the alarm is resolved / a false
        alarm, after which the follow is forgotten). One followed alarm per
        phone: a new token replaces the previous one. The phone is named by
        its push registration (`PUT /api/v2/push/registration` first); the
        alarm must be in the caller's camera scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [apnsToken, alarmId, activityToken]
              properties:
                apnsToken: { type: string, description: "this phone's registered APNs device token, hex" }
                alarmId: { type: string }
                activityToken: { type: string, description: "the Live Activity's push token, hex (32-200 characters)" }
      responses:
        "204": { description: Following. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [push]
      summary: Stop Live Activity updates to this phone. Only the caller's own registration is changed.
      parameters:
        - name: apnsToken
          in: query
          required: true
          schema: { type: string }
      responses:
        "204": { description: Stopped (also when nothing was followed). }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------- roles ---
  /api/v2/roles:
    get:
      tags: [security]
      summary: Roles with their permission ids and user counts (ManageUsers).
      responses:
        "200":
          description: Roles.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RoleDefinition" } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [security]
      summary: Create a custom role (ManageUsers).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleDefinition" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v2/roles/{roleId}:
    parameters:
      - name: roleId
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [security]
      summary: Edit a custom role (ManageUsers). Renaming moves its users along. Built-ins answer 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleDefinition" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [security]
      summary: Delete a custom role (ManageUsers). 409 for built-ins and while users hold it.
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v2/permissions:
    get:
      tags: [security]
      summary: The permission catalog (ManageUsers).
      responses:
        "200":
          description: Every permission.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/PermissionInfo" } }
        "403": { $ref: "#/components/responses/Forbidden" }

  # --------------------------------------------------------------- zones ---
  /api/v2/cameras/{cameraId}/zones:
    parameters:
      - name: cameraId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [zones]
      summary: The camera's detection zones and privacy masks (camera scope applies).
      responses:
        "200":
          description: Zones in creation order.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/CameraZone" } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [zones]
      summary: Replace the camera's full zone set atomically (ManageCameras). Polygons have 3-20 vertices, normalized 0-1, and must not self-intersect. Detect zones gate motion/object detection; mask zones are burned black in server JPEGs and exports; line zones (exactly 2 points, meta.direction ltr|rtl|both, meta.severity Critical|Warning|Info) are tripwires that raise "Line crossing" events and alarms (at the line's severity; none for Info) when a tracked person/vehicle/animal crosses them in that direction (one event per object per line per 10 s). Lines never gate detection or mask pixels.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraZonesPut" }
      responses:
        "200":
          description: The stored zones.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/CameraZone" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ------------------------------------------------------ edge recovery ---
  /api/v2/cameras/{cameraId}/edge-recovery:
    post:
      tags: [edge-recovery]
      summary: Fill recording gaps from the camera's own SD card (ONVIF Profile G; ExportEvidence, camera scope, audited).
      description: |
        The camera's recording server finds the gaps in its recordings of
        the camera over [fromMs, toMs) (holes of 10 s or more), asks the
        camera's recording search which of its recordings cover them, and
        pulls the footage over RTSP replay into normal segments (pieces of
        at most 15 minutes), each with a `.edge` marker; they then play back,
        export and expire like any footage, and timeline spans made of them
        carry `edge: true`. An existing segment is never replaced. Answers
        201 as soon as the recording server accepted the job; progress is in
        the tasks list (kind export) and GET /api/v2/edge-recovery/{taskId}.
        Offer it when the camera reports `edgeRecording`. A range over 24
        hours answers 400; a camera without an ONVIF address 400; a range in
        which the camera sat on another recording server 409; another
        recovery already running for the camera 429.
      parameters:
        - $ref: "#/components/parameters/CameraId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fromMs, toMs]
              properties:
                fromMs: { type: integer, format: int64, description: Unix ms }
                toMs: { type: integer, format: int64, description: "Unix ms; at most 24 h after fromMs (clamped to now)" }
      responses:
        "201":
          description: The running (or, with nothing to recover, finished) job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EdgeRecovery" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/edge-recovery/{taskId}:
    get:
      tags: [edge-recovery]
      summary: An edge recovery job's state (ExportEvidence; the user who started it). Kept for an hour after it finished.
      parameters:
        - $ref: "#/components/parameters/EdgeTaskId"
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EdgeRecovery" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [edge-recovery]
      summary: Cancel a running edge recovery (ExportEvidence, audited). Segments already recovered stay.
      parameters:
        - $ref: "#/components/parameters/EdgeTaskId"
      responses:
        "200":
          description: The job once it has stopped. Cancelling a finished job changes nothing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EdgeRecovery" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------- appearance ---
  /api/v2/events/{eventId}/similar:
    post:
      tags: [appearance]
      summary: Find events showing the same-looking person or vehicle (ViewLive, like event search; audited).
      description: |
        Appearance search. The event's detection box is cropped from its
        thumbnail and embedded by the optional re-identification model
        (computed now and stored if the event wasn't indexed yet); stored
        vectors of the same model are then ranked by cosine similarity,
        brute force over the candidates pre-filtered by camera and time
        (the newest 200,000 at most). Results stay within the caller's
        camera scope and leave out the query event. By default only events
        of the same kind (Person, Vehicle, ...) are compared. 503 when no
        model is installed (the message says why), 400 when the event has no
        detection box or it is too small, 409 when its snapshot can't be
        fetched.
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SimilarEventsRequest" }
      responses:
        "200":
          description: The query event and its matches, best first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimilarEvents" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v2/appearance:
    get:
      tags: [appearance]
      summary: Whether appearance search is available, with which model, how many events are indexed, and the latest index job (ViewLive).
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppearanceStatus" }
  /api/v2/appearance/backfill:
    post:
      tags: [appearance]
      summary: Index the newest events that have no appearance vector yet (ChangeSettings, audited).
      description: |
        Considers the newest 50,000 events with a detection box and a
        thumbnail; progress also shows in the tasks list (kind appearance).
        Answers 201 with a new job, or 200 with the one already running.
        409 when no model is installed.
      responses:
        "200":
          description: The job already running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppearanceBackfill" }
        "201":
          description: The started job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppearanceBackfill" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [appearance]
      summary: Cancel the running index job (ChangeSettings, audited); vectors stored so far are kept.
      description: Answers with the job once it has stopped. Cancelling a finished job changes nothing.
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppearanceBackfill" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  # ------------------------------------------------------------ wave16 ---
  # Detection depth: model catalog and detector tiers (wave16-models),
  # faces and people (wave16-faces), plates (wave16-plates), semantic
  # search (wave16-semantic). Tracking and loitering ride on the camera
  # (loiterSeconds) and on Event.trackId (wave16-tracking).
  /api/v2/models:
    get:
      tags: [detection]
      summary: The model catalog with each model's install state (ViewLive).
      description: |
        Every model Sentinel knows how to use: the bundled detector, the
        downloadable detector tiers and the optional models behind
        appearance search, audio classification, faces, plates and semantic
        search. `installed` reflects `<data>/models` on the management
        server; a file put there by hand counts when its SHA-256 matches.
      responses:
        "200":
          description: The catalog.
          content:
            application/json:
              schema:
                type: object
                required: [items, dir]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Model" } }
                  dir: { type: string, description: "Where model files live, for hand installs." }
  /api/v2/models/{modelId}:
    delete:
      tags: [detection]
      summary: Remove a downloaded model file (ChangeSettings, audited).
      description: 409 when the model is bundled, selected as the detector, or downloading. Engines notice on restart.
      parameters:
        - $ref: "#/components/parameters/ModelId"
      responses:
        "204": { description: Removed (or was not installed). }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v2/models/{modelId}/download:
    post:
      tags: [detection]
      summary: Download a catalog model into the models directory (ChangeSettings, audited).
      description: |
        Fetches the pinned URL to a temporary file, verifies the SHA-256,
        then moves it into place. Progress shows in the tasks list (kind
        `model-download`). 201 with the new job, 200 with the job already
        running for this model, 409 when the model is bundled or already
        installed, 502 when the download fails to start.
      parameters:
        - $ref: "#/components/parameters/ModelId"
      responses:
        "200":
          description: The job already running.
          content: { application/json: { schema: { $ref: "#/components/schemas/ModelDownload" } } }
        "201":
          description: The started job.
          content: { application/json: { schema: { $ref: "#/components/schemas/ModelDownload" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { description: The download could not start. }
    delete:
      tags: [detection]
      summary: Cancel a running download (ChangeSettings, audited); the partial file is deleted.
      parameters:
        - $ref: "#/components/parameters/ModelId"
      responses:
        "200":
          description: The job once it has stopped.
          content: { application/json: { schema: { $ref: "#/components/schemas/ModelDownload" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v2/detector:
    get:
      tags: [detection]
      summary: Object detection settings and what is actually running (ViewLive).
      responses:
        "200":
          description: Settings and status.
          content: { application/json: { schema: { $ref: "#/components/schemas/DetectorSettings" } } }
    put:
      tags: [detection]
      summary: Choose the detector model and the detection rate (ChangeSettings, audited).
      description: |
        `model` must be an installed catalog model whose purpose is
        `detector` (400 otherwise; 409 when it is still downloading).
        `rate` is passes per second per camera while there is motion: 0 =
        auto (1 on the CPU, 5 with an accelerator), else 1–5. The change
        reaches the recorders at once; a model change takes effect when
        the recorder's detector restarts (status says `pending` until then).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                model: { type: string, description: "catalog id; \"\" = yolox-tiny" }
                rate: { type: integer, minimum: 0, maximum: 5 }
      responses:
        "200":
          description: The settings as saved, with status.
          content: { application/json: { schema: { $ref: "#/components/schemas/DetectorSettings" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v2/faces:
    get:
      tags: [faces]
      summary: Face recognition settings and status (ViewLive).
      responses:
        "200":
          description: Status.
          content: { application/json: { schema: { $ref: "#/components/schemas/FacesStatus" } } }
    put:
      tags: [faces]
      summary: Turn face recognition on or off (ChangeSettings, audited).
      description: |
        Off by default. Turning it on requires both face models installed
