      tags: [wall-layouts]
      summary: >-
        Save a wall layout (the Mac operator app's monitor windows). Private unless shared;
        sharing needs manageViews (403). Cameras must be in the caller's scope and views
        ones the caller may open (400). Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WallLayoutInput" }
      responses:
        "201":
