  # ------------------------------------------------- device codes (WAVE10) ---
  /api/v2/device-codes:
    post:
      tags: [device-codes]
      summary: Start a device-code sign-in (Sentinel TV).
      description: |
        RFC 8628 style. The device shows `userCode` and `verifyUrl` (the
        dashboard's /link page) and then polls
        `POST /api/v2/device-codes/token` no faster than every `interval`
        seconds. Codes expire after `expiresIn` seconds. Unauthenticated
        and rate limited per client address.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceCodeRequest" }
      responses:
        "200":
          description: A new code pair.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceCodeGrant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v2/device-codes/token:
    post:
      tags: [device-codes]
      summary: Poll for the token pair of a device-code sign-in.
      description: |
        Until the code is approved this answers 400 with error code
        `authorization_pending`; polling faster than `interval` answers
        `slow_down` (add 5 s to the interval); a refused code answers
        `access_denied`; an expired, unknown or already redeemed code
        answers `expired_token`. Once approved, the first poll gets a token
        pair (redeemed once). The pair acts for the approving user with
        their camera scope, capped at the Viewer role.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [deviceCode]
              properties:
                deviceCode: { type: string }
      responses:
        "200":
          description: The device's token pair.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v2/device-codes/lookup:
    post:
      tags: [device-codes]
      summary: Which device is waiting behind a user code.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceCodeDecision" }
      responses:
        "200":
          description: The waiting device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceCodeInfo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v2/device-codes/approve:
    post:
      tags: [device-codes]
      summary: Sign the waiting device in as me, viewer only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceCodeDecision" }
      responses:
        "200":
          description: Approved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceCodeInfo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v2/device-codes/deny:
    post:
      tags: [device-codes]
      summary: Refuse the waiting device.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceCodeDecision" }
      responses:
        "200":
          description: Refused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceCodeInfo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # --------------------------------------------- Sentinel Cloud (WAVE12) ---
  /api/v2/cloud:
    get:
      tags: [cloud]
      summary: >-
        Sentinel Cloud status (viewLive): whether this Management Server is linked, the plan,
        remote access, push and offsite backup, and `signIn`, what a client needs to sign in to
        a Sentinel Cloud account (from an hour-long cache; never waits for Sentinel Cloud: null
        while it is first fetched in the background, so read it again shortly). A pending
        `link` code is only shown with changeSettings. Times are RFC 3339 strings or null.
        Recording Servers answer 404.
      responses:
        "200":
          description: The status.
          content: { application/json: { schema: { $ref: "#/components/schemas/CloudStatus" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [cloud]
      summary: >-
        Turn remote access or offsite backup on or off (changeSettings, audited). Omitted fields
        stay as they are. Turning backup off forgets the upload position, so turning it back on
        starts with new alarms.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CloudSettings" } } }
      responses:
        "200":
          description: The status after the change.
          content: { application/json: { schema: { $ref: "#/components/schemas/CloudStatus" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v2/cloud/link:
    post:
      tags: [cloud]
      summary: >-
        Link this server to Sentinel Cloud (changeSettings). With `{"accessToken"}`, the session
        token of a Sentinel Cloud account the client just signed in to, the server links by
        itself and answers once linked (audited "Linked Sentinel Cloud"); the token is used
        once and never stored. With no body, the code flow: the status comes back with `link`
        filled, the owner enters `userCode` at `verifyURL`, and the server polls in the
        background until the code is approved (audited) or expires; while a code is pending,
        the same code comes back. Errors with a token are `cloud_sign_in` (401: Sentinel Cloud
        didn't accept the sign-in; sign in to the account again, not to Sentinel),
        `cloud_server_limit` (402, with `upgradeURL`), `cloud_already_linked` (409) and
        `cloud_unreachable` (502); the code flow keeps `conflict` (409) and `unavailable` (502).
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/CloudLinkAccount" } } }
      responses:
        "200":
          description: The status, linked (with a token) or with the pending link (no body).
          content: { application/json: { schema: { $ref: "#/components/schemas/CloudStatus" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: >-
            `cloud_sign_in`: Sentinel Cloud didn't accept the account token (or `unauthorized`:
            not signed in to Sentinel).
          content: { application/json: { schema: { $ref: "#/components/schemas/CloudLinkError" } } }
        "402":
          description: "`cloud_server_limit`: the account's plan allows no more servers; `upgradeURL` says where to upgrade."
          content: { application/json: { schema: { $ref: "#/components/schemas/CloudLinkError" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`cloud_already_linked` (with a token) or `conflict` (no body): this server is already linked."
          content: { application/json: { schema: { $ref: "#/components/schemas/CloudLinkError" } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502":
          description: "`cloud_unreachable` (with a token) or `unavailable` (no body): Sentinel Cloud couldn't be reached or failed."
          content: { application/json: { schema: { $ref: "#/components/schemas/CloudLinkError" } } }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      tags: [cloud]
      summary: >-
        Cancel a pending link code, or unlink (changeSettings, audited). Unlinking tells Sentinel
        Cloud to forget this server and forgets the link here even when Sentinel Cloud can't be
        reached. Answers the unlinked status.
      responses:
        "200":
          description: The status after unlinking.
          content: { application/json: { schema: { $ref: "#/components/schemas/CloudStatus" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v2/cloud/refresh:
    post:
      tags: [cloud]
      summary: >-
        Refresh the plan from Sentinel Cloud now (changeSettings), e.g. right after subscribing:
        bypasses the 5-minute limit of the status read, but asks Sentinel Cloud at most once per
        10 seconds (sooner, the cached status comes back). A refresh that fails leaves the
        cached plan; not linked, there is nothing to refresh. Answers the status either way.
      responses:
        "200":
          description: The status after the refresh.
          content: { application/json: { schema: { $ref: "#/components/schemas/CloudStatus" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v2/cloud/remote:
    get:
      tags: [cloud]
      summary: >-
        The address phones use from outside the site (viewLive): Sentinel Cloud's stable address
        while remote access through it applies, else the quick tunnel's, else null.
      responses:
        "200":
          description: The remote address.
          content: { application/json: { schema: { $ref: "#/components/schemas/CloudRemote" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v2/cloud/backup-access:
    get:
      tags: [cloud]
      summary: >-
        A read-only token for this server's offsite backup (viewLive, and only for users who see
        every camera: 403 otherwise). Phones list and fetch `baseURL/objects` with it directly,
        even when the server is off. 404 when backup is off or the server isn't linked.
      responses:
        "200":
          description: The backup token.
          content: { application/json: { schema: { $ref: "#/components/schemas/CloudBackupAccess" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Unavailable" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Access token from `POST /api/v2/auth/token`.
    session:
      type: apiKey
      in: cookie
      name: sentinel_session
      description: The web dashboard's session.

  parameters:
    ModelId:
      name: modelId
      in: path
      required: true
      schema: { type: string }
    FaceId:
      name: faceId
      in: path
      required: true
      schema: { type: string }
    PersonId:
      name: personId
      in: path
      required: true
      schema: { type: string }
    PlateId:
      name: plateId
      in: path
      required: true
      schema: { type: string }
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema: { type: string }
    ServerId:
      name: serverId
      in: path
      required: true
      schema: { type: string }
    CameraId:
      name: cameraId
      in: path
      required: true
      schema: { type: string }
    AlarmId:
      name: alarmId
      in: path
      required: true
      schema: { type: string }
    IncidentId:
      name: id
      in: path
      required: true
      schema: { type: string }
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string }
    From:
      name: from
      in: query
      required: true
      description: Unix ms.
      schema: { type: integer, format: int64 }
    To:
      name: to
      in: query
      required: true
      description: Unix ms.
      schema: { type: integer, format: int64 }
    Cursor:
      name: cursor
      in: query
      description: "`nextCursor` from the previous page."
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    ExportTaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string }
      description: The task id returned when the export job was started.
    EdgeTaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string }
      description: The task id returned when the edge recovery was started.
    ExportScheduleId:
      name: scheduleId
      in: path
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: The request is malformed or invalid.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: Not signed in, or the token expired.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: The user's role can't do this.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: No such thing.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: The request conflicts with the current state.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    TooManyRequests:
      description: Slow down.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unavailable:
      description: The recording server for this camera isn't reachable.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    CloudRequired:
      description: >-
        Needs a Sentinel Cloud subscription (plan cloud or business, active or in grace):
        code cloud_required, message "Uploading videos is part of Sentinel Cloud." or
        "Using an iPhone as a camera is part of Sentinel Cloud."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                Stable machine code: bad_request, unauthorized, forbidden,
                not_found, conflict, too_many_requests, unavailable,
                timeout, token_reused, internal; linking Sentinel Cloud with
                an account also answers cloud_sign_in, cloud_server_limit,
                cloud_already_linked and cloud_unreachable (CloudLinkError);
                features that need Sentinel Cloud answer 402 cloud_required.
            message: { type: string }

    # auth
    PasswordGrant:
      type: object
      additionalProperties: false
      required: [grantType, name, password]
      properties:
        grantType: { const: password }
        name: { type: string }
        password: { type: string }
        client: { type: string, maxLength: 100, description: "Label for the audit log, e.g. \"Sentinel Operator (Mac mini)\"." }
    RefreshGrant:
      type: object
      additionalProperties: false
      required: [grantType, refreshToken]
      properties:
        grantType: { const: refresh }
        refreshToken: { type: string }
    TokenResponse:
      type: object
      required: [tokenType, accessToken, expiresAt, refreshToken, refreshExpiresAt, user]
      properties:
        tokenType: { const: Bearer }
        accessToken: { type: string }
        expiresAt: { type: integer, format: int64 }
        refreshToken: { type: string }
        refreshExpiresAt: { type: integer, format: int64 }
        user: { $ref: "#/components/schemas/User" }
    Me:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [permissions]
          properties:
            permissions:
              type: array
              items: { $ref: "#/components/schemas/Permission" }
    Permission:
      type: string
      enum: [manageCameras, manageUsers, changeSettings, viewAudit, acknowledgeAlarms, exportEvidence, viewLive, controlPtz, manageViews]
    PTZPreset:
      type: object
      required: [token, name]
      properties:
        token: { type: string }
        name: { type: string }
    PTZState:
      type: object
      required: [supported, presets]
      properties:
        supported: { type: boolean }
        presets: { type: array, items: { $ref: "#/components/schemas/PTZPreset" } }
    PTZMove:
      type: object
      required: [pan, tilt, zoom]
      properties:
        pan: { type: number, minimum: -1, maximum: 1 }
        tilt: { type: number, minimum: -1, maximum: 1 }
        zoom: { type: number, minimum: -1, maximum: 1 }
    StreamRange:
      type: object
      required: [min, max]
      properties:
        min: { type: integer }
        max: { type: integer, description: 0 = the camera did not report a limit. }
    StreamCurrent:
      type: object
      required: [width, height, fps, bitrate, govLength, quality]
      properties:
        width: { type: integer }
        height: { type: integer }
        fps: { type: integer }
        bitrate: { type: integer, description: kbit/s; 0 = not reported. }
        govLength: { type: integer, description: Keyframe interval in frames. }
        quality: { type: integer }
    StreamOptions:
      type: object
      required: [resolutions, fps, bitrate, gov, quality]
      properties:
        resolutions:
          type: array
          items:
            type: object
            required: [width, height]
            properties:
              width: { type: integer }
              height: { type: integer }
        fps: { $ref: "#/components/schemas/StreamRange" }
        bitrate: { $ref: "#/components/schemas/StreamRange" }
        gov: { $ref: "#/components/schemas/StreamRange" }
        quality: { $ref: "#/components/schemas/StreamRange" }
    Stream:
      type: object
      required: [configToken, profileToken, name, inUse, encoding, current, options]
      properties:
        configToken: { type: string }
        profileToken: { type: string }
        name: { type: string }
        inUse: { type: string, enum: ["main", "sub", ""], description: Which of the camera's stored streams this feeds. }
        encoding: { type: string, description: "H264, JPEG, ... (read-only)." }
        current: { $ref: "#/components/schemas/StreamCurrent" }
        options: { $ref: "#/components/schemas/StreamOptions" }
    StreamSettings:
      type: object
      required: [streams]
      properties:
        streams: { type: array, items: { $ref: "#/components/schemas/Stream" } }
    StreamSettingsChange:
      type: object
      properties:
        width: { type: integer, minimum: 0, description: Set together with height. }
        height: { type: integer, minimum: 0 }
        fps: { type: integer, minimum: 0 }
        bitrate: { type: integer, minimum: 0 }
        govLength: { type: integer, minimum: 0 }
        quality: { type: integer, minimum: 0 }
    StreamsDiscoverRequest:
      type: object
      description: Optional login for this discovery only (never stored); absent fields use the camera's saved ones.
      properties:
        username: { type: string }
        password: { type: string }
    FoundStream:
      type: object
      required: [url, label, width, height, fps, codec, source, role]
      properties:
        url: { type: string, description: RTSP address without credentials. }
        label: { type: string, description: "e.g. 1280×720 · H.264 · 15 fps" }
        width: { type: integer, description: 0 when unknown (guessed streams). }
        height: { type: integer }
        fps: { type: number }
        codec: { type: string, description: "H264, H265, MJPEG, another name, or empty when unknown." }
        source: { type: string, enum: [onvif, guess] }
        role: { type: string, enum: [main, sub, ""], description: What the camera uses this stream for now. }
        encoderToken: { type: string, description: Present when the stream can be resized over ONVIF. }
    TooSmallSub:
      type: object
      required: [url, encoderToken, width, height]
      properties:
        url: { type: string }
        encoderToken: { type: string }
        width: { type: integer }
        height: { type: integer }
    StreamDiscovery:
      type: object
      required: [streams, recommendedSub, tooSmallSub]
      properties:
        streams: { type: array, items: { $ref: "#/components/schemas/FoundStream" } }
        recommendedSub:
          type: [string, "null"]
          description: URL of the smallest H.264/H.265 stream of at least 640×360 that isn't the main one (else the smallest, else the first guess).
        tooSmallSub:
          description: Set when no extra stream reaches 640×360 but the best one can be resized over ONVIF.
          oneOf: [{ $ref: "#/components/schemas/TooSmallSub" }, { type: "null" }]
    CameraStreamError:
      type: object
      required: [error, authFailed]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, enum: [camera_auth, camera_unreachable] }
            message: { type: string }
        authFailed: { type: boolean }
    StreamResize:
      type: object
      required: [encoderToken, width, height]
      properties:
        encoderToken: { type: string }
        width: { type: integer, minimum: 1, example: 1280 }
        height: { type: integer, minimum: 1, example: 720 }
        fps: { type: integer, minimum: 0, description: 0 or absent keeps the camera's frame rate. }
    Role:
      type: string
      description: A built-in role (Admin, Supervisor, Operator, Viewer) or the name of a custom role from /api/v2/roles.
    User:
      type: object
      required: [id, name, role, createdAt, source, scope]
      properties:
        id: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        createdAt: { type: integer, format: int64 }
        source: { type: string, enum: [local, ldap, oidc] }
        scope: { $ref: "#/components/schemas/UserScope" }
    UserScope:
      type: object
      required: [allCameras, groupIds]
      description: Which cameras the role applies to. Admins always have all cameras.
      properties:
        allCameras: { type: boolean }
        groupIds: { type: array, items: { type: string } }

    # events stream
    StreamMessage:
      type: object
      required: [type, at]
      description: |
        `data` by type:
        - `hello`: `{ "user": User, "topics": [string], "serverVersion": string }`
        - `alarm.new`, `alarm.updated`: `Alarm`
        - `event.new`, `event.updated`: `Event`
        - `camera.status`: `{ "cameraId", "online" }` (sent on change only)
        - `camera.activity`: `{ "cameraId", "kind" }` (topic `activity`)
        - `config.changed`: `{ "cameraIds": [string] }` (re-read cameras)
        - `recorder.status`: `{ "recorderId", "online" }` (topic `servers`)
        - `lagged`: `{ "dropped": int }` (the client fell behind; re-read state)
      properties:
        type:
          type: string
          enum: [hello, alarm.new, alarm.updated, event.new, event.updated, camera.status, camera.activity, config.changed, recorder.status, lagged]
        at: { type: integer, format: int64 }
        data: {}

    # video
    VideoRight:
      type: string
      enum: [live, playback, export, push]
      description: "push: an iPhone camera publishing its video; only from push-token (video-token refuses it)"
    PhoneCameraCreated:
      type: object
      required: [camera, pushKey]
      properties:
        camera: { $ref: "#/components/schemas/Camera" }
        pushKey: { type: string, description: "32 random bytes, base64url; shown only here (stored hashed)" }
    PhoneStatus:
      type: object
      required: [streaming, hasPushKey]
      properties:
        streaming: { type: boolean, description: a push session is open }
        device: { type: string, description: the phone's name from its last session }
        lastSeenAt: { type: integer, format: int64, description: "Unix ms of its last segment; absent = not since its recording server started" }
        hasPushKey: { type: boolean, description: "false after the key was revoked" }
    VideoToken:
      type: object
      required: [token, baseUrl, gatewayUrl, expiresAt, rights, cameraId, recorderId]
      properties:
        token: { type: string }
        baseUrl: { type: string, description: "`{recorderUrl}/v/{token}`: the recording server directly when its public URL is known, else the same as gatewayUrl" }
        gatewayUrl: { type: string, description: "`/v/{token}` on this management server (works wherever the API does: remote access, tunnels)" }
        expiresAt: { type: integer, format: int64 }
        rights: { type: array, items: { $ref: "#/components/schemas/VideoRight" } }
        cameraId: { type: string }
        recorderId: { type: string }

    # cameras
    Camera:
      type: object
      required: [id, name, location, rtspUrl, subRtspUrl, username, hasPassword, recording, retentionDays, recordingMode, effectiveRecordingMode, recordTrigger, preRollSeconds, postRollSeconds, lowResRetentionDays, fps, motionLevel, alertOn, onvifUrl, cameraAnalytics, sortOrder, createdAt, recorderId, groupIds, status]
      properties:
        id: { type: string }
        name: { type: string }
        location: { type: string }
        rtspUrl: { type: string, description: without credentials }
        subRtspUrl: { type: string }
        username: { type: string }
        hasPassword: { type: boolean }
        recording: { type: boolean, description: "effectiveRecordingMode != off (kept for older clients; recordingMode is the setting)" }
        retentionDays: { type: integer, description: "full-res retention; 0 = site default" }
        recordingMode: { $ref: "#/components/schemas/RecordingMode" }
        effectiveRecordingMode: { $ref: "#/components/schemas/EffectiveRecordingMode" }
        recordTrigger: { $ref: "#/components/schemas/RecordTrigger" }
        preRollSeconds: { type: integer, minimum: 0, maximum: 30, description: "events/dual: footage kept before the first activity; 0 = server default" }
        postRollSeconds: { type: integer, minimum: 0, maximum: 120, description: "events/dual: footage kept after the last activity; 0 = server default, else 5..120" }
        lowResRetentionDays: { type: integer, minimum: 0, maximum: 365, description: "dual: low-res 24/7 retention; 0 = server default" }
        fps: { type: integer }
        motionLevel: { type: integer, minimum: 0, maximum: 3 }
        alertOn: { $ref: "#/components/schemas/AlertOn" }
        onvifUrl: { type: string }
        cameraAnalytics: { type: boolean }
        audioDetect: { type: boolean, description: "audio event detection (loud noise; glass break, scream, gunshot, alarm with an optional model) is on" }
        audioThresholdDb: { type: integer, minimum: 6, maximum: 60, description: "dB over the rolling noise floor that counts as a loud noise (default 25); kept while detection is off" }
        loiterSeconds: { type: integer, minimum: 0, maximum: 3600, description: "a person track present this long raises a Loitering event (wave16-tracking); 0 = off" }
        sortOrder: { type: integer }
        createdAt: { type: integer, format: int64 }
        recorderId: { type: string }
        groupIds: { type: array, items: { type: string } }
        masks: { type: array, items: { $ref: "#/components/schemas/ZonePolygon" }, description: enabled privacy-mask polygons to overlay on video }
        status: { $ref: "#/components/schemas/CameraStatus" }
        edgeRecording: { type: boolean, description: "the camera offers ONVIF Profile G recording search and replay: its SD-card footage can fill gaps (POST /api/v2/cameras/{cameraId}/edge-recovery)" }
        talkback: { type: boolean, description: "the camera offers an ONVIF audio backchannel (G.711 µ-law) for /talkback; probed when saved and when first listed, kept in memory only (false until a probe answers)" }
        source: { type: string, enum: [rtsp, phone], description: "phone = an iPhone pushing its video (no RTSP/ONVIF fields, no dual recording)" }
        phone: { $ref: "#/components/schemas/PhoneStatus" }
        lastSeenAt: { type: integer, format: int64, description: "phone cameras: phone.lastSeenAt" }
    AlertOn:
      type: string
      enum: [auto, motion, peopleAndVehicles, people]
    RecordingMode:
      type: string
      enum: [default, continuous, events, dual, "off"]
      description: "default = the server's defaultMode; continuous = main stream 24/7; events = main stream around events (pre/post-roll); dual = sub-stream 24/7 plus the main stream around events (needs subRtspUrl); off = live only"
    EffectiveRecordingMode:
      type: string
      enum: [continuous, events, dual, "off"]
      description: "what the recorder does: default resolved, dual without a sub-stream falls back to events"
    RecordTrigger:
      type: string
      enum: [default, motion, objects]
      description: "what starts an events/dual recording: motion = any motion, Sentinel detections and camera events; objects = people and vehicles only; default = the server's defaultTrigger"
    RecordingSettings:
      type: object
      required: [defaultMode, defaultTrigger, defaultPreRollSeconds, defaultPostRollSeconds, defaultRetentionDays, defaultLowResRetentionDays, minFreePercent]
      properties:
        defaultMode: { $ref: "#/components/schemas/EffectiveRecordingMode" }
        defaultTrigger: { type: string, enum: [motion, objects] }
        defaultPreRollSeconds: { type: integer, minimum: 0, maximum: 30 }
        defaultPostRollSeconds: { type: integer, minimum: 5, maximum: 120 }
        defaultRetentionDays: { type: integer, minimum: 1, maximum: 3650, description: "full-res; the same value as v1 settings defaultRetentionDays" }
        defaultLowResRetentionDays: { type: integer, minimum: 1, maximum: 365, description: "dual low-res; unset = 2x defaultRetentionDays" }
        minFreePercent: { type: integer, minimum: 0, maximum: 50, description: "0 = off, else 5..50: when free space on the recordings disk drops under it, the oldest footage is deleted (low-res first)" }
    RecordingSettingsPatch:
      type: object
      additionalProperties: false
      properties:
        defaultMode: { $ref: "#/components/schemas/EffectiveRecordingMode" }
        defaultTrigger: { type: string, enum: [motion, objects] }
        defaultPreRollSeconds: { type: integer, minimum: 0, maximum: 30 }
        defaultPostRollSeconds: { type: integer, minimum: 5, maximum: 120 }
        defaultRetentionDays: { type: integer, minimum: 1, maximum: 3650 }
        defaultLowResRetentionDays: { type: integer, minimum: 1, maximum: 365 }
        minFreePercent: { type: integer, minimum: 0, maximum: 50, description: "0 or 5..50" }
    CameraStatus:
      type: object
      required: [online, viewers, message]
      properties:
        online: { type: boolean }
        viewers: { type: integer }
        width: { type: integer }
        height: { type: integer }
        analytics: { type: string, description: "camera analytics subscription state; empty = off" }
        audio: { type: string, description: "audio detection detail: what the listener is doing, and why the sound classifier is not running (no model file, runtime missing …); empty = audio detection off" }
        message: { type: string, description: "Online | No signal | Media engine starting | Recording server offline; phone cameras: Streaming from <device> | Phone not streaming | Needs Sentinel Cloud" }
    CameraInput:
      type: object
      additionalProperties: false
      required: [name, rtspUrl]
      properties:
        name: { type: string }
        location: { type: string }
        rtspUrl: { type: string, description: "credentials typed into the URL move into username/password" }
        subRtspUrl: { type: string }
        username: { type: string }
        password: { type: string }
        recording: { type: boolean, default: true, description: "without recordingMode: false = off, true = default" }
        retentionDays: { type: integer, minimum: 0, maximum: 3650 }
        recordingMode: { $ref: "#/components/schemas/RecordingMode" }
        recordTrigger: { $ref: "#/components/schemas/RecordTrigger" }
        preRollSeconds: { type: integer, minimum: 0, maximum: 30, description: "0 (default) = server default" }
        postRollSeconds: { type: integer, minimum: 0, maximum: 120, description: "0 (default) = server default, else 5..120" }
        lowResRetentionDays: { type: integer, minimum: 0, maximum: 365, description: "0 (default) = server default" }
        motionLevel: { type: integer, minimum: 0, maximum: 3, default: 2 }
        alertOn: { $ref: "#/components/schemas/AlertOn" }
        onvifUrl: { type: string }
        cameraAnalytics: { type: boolean, default: true }
        audioDetect: { type: boolean, default: false }
        audioThresholdDb: { type: integer, minimum: 6, maximum: 60, default: 25 }
        loiterSeconds: { type: integer, minimum: 0, maximum: 3600, default: 0 }
        recorderId: { type: string, description: "recording server; default: the local one, else the only one" }
        groupIds: { type: array, items: { type: string } }
        source: { type: string, enum: [rtsp], description: "only rtsp here; iPhone cameras: POST /api/v2/phone-cameras" }
    CameraPatch:
      type: object
      additionalProperties: false
      properties:
        source: { type: string, enum: [rtsp, phone], description: "can't change; accepted when it matches the camera's" }
        name: { type: string }
        location: { type: string }
        rtspUrl: { type: string }
        subRtspUrl: { type: string }
        username: { type: string }
        password: { type: string, description: '"" clears it; absent keeps it' }
        recording: { type: boolean, description: "without recordingMode: false sets off; true turns an off camera to default and keeps any other mode" }
        retentionDays: { type: integer, minimum: 0, maximum: 3650 }
        recordingMode: { $ref: "#/components/schemas/RecordingMode" }
        recordTrigger: { $ref: "#/components/schemas/RecordTrigger" }
        preRollSeconds: { type: integer, minimum: 0, maximum: 30 }
        postRollSeconds: { type: integer, minimum: 0, maximum: 120, description: "0 or 5..120" }
        lowResRetentionDays: { type: integer, minimum: 0, maximum: 365 }
        motionLevel: { type: integer, minimum: 0, maximum: 3 }
        alertOn: { $ref: "#/components/schemas/AlertOn" }
        onvifUrl: { type: string }
        cameraAnalytics: { type: boolean }
        audioDetect: { type: boolean }
        audioThresholdDb: { type: integer, minimum: 6, maximum: 60 }
        loiterSeconds: { type: integer, minimum: 0, maximum: 3600, description: "wave16-tracking; 0 = off" }
        sortOrder: { type: integer }
        recorderId: { type: string, description: "moves the camera; footage recorded so far stays on the old server and stays playable" }
        groupIds: { type: array, items: { type: string } }

    # recordings
    Span:
      type: object
      required: [start, end]
      properties:
        start: { type: integer, format: int64 }
        end: { type: integer, format: int64 }
        media: { type: number, description: seconds into the playback playlist for the same window (of the same recorderId) }
        recorderId: { type: string, description: recording server that has this footage }
        edge: { type: boolean, description: "footage recovered from the camera's SD card (edge recovery); absent = recorded live" }
        quality: { type: string, enum: [full, low], description: "low = the low-res 24/7 stream of a dual camera; absent = full" }
    Timeline:
      type: object
      required: [from, to, now, spans, pending, writing, events, alarms]
      properties:
        from: { type: integer, format: int64 }
        to: { type: integer, format: int64 }
        now: { type: integer, format: int64 }
        spans: { type: array, items: { $ref: "#/components/schemas/Span" } }
        pending: { type: array, items: { $ref: "#/components/schemas/Span" } }
        writing: { type: boolean }
        events: { type: array, items: { $ref: "#/components/schemas/Event" } }
        alarms: { type: array, items: { $ref: "#/components/schemas/Alarm" } }
    Segment:
      type: object
      required: [name, start, end, size, writing]
      properties:
        name: { type: string, description: "file name under /recordings/{cameraId}/ on the video plane" }
        start: { type: integer, format: int64 }
        end: { type: integer, format: int64 }
        size: { type: integer, format: int64 }
        writing: { type: boolean }
        recorderId: { type: string }

    # alarms
    AlarmState:
      type: string
      enum: [New, Acknowledged, Investigating, Snoozed, Resolved, False Alarm]
    Alarm:
      type: object
      required: [id, kind, title, detail, severity, state, owner, createdAt, updatedAt, lastEventAt, eventCount, responseLog]
      properties:
        id: { type: string }
        cameraId: { type: string }
        cameraName: { type: string }
        kind: { type: string, description: "Motion, Person, Vehicle, Camera Offline, Storage, Line crossing (from a Sentinel line or the camera's own analytics), audio, …" }
        title: { type: string }
        detail: { type: string }
        severity: { type: string, enum: [Critical, Warning, Info] }
        state: { $ref: "#/components/schemas/AlarmState" }
        owner: { type: string }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
        lastEventAt: { type: integer, format: int64 }
        eventCount: { type: integer }
        eventId: { type: string }
        instructions:
          type: array
          description: what to do, from every enabled rule that matches
          items:
            type: object
            required: [rule, text]
            properties:
              rule: { type: string }
              text: { type: string }
        responseLog: { type: array, items: { type: string } }
    IncidentStatus:
      type: string
      enum: [open, investigating, closed]
    IncidentSeverity:
      type: string
      enum: [low, medium, high, critical]
    Incident:
      type: object
      required: [id, title, status, severity, summary, createdBy, createdAt, updatedAt, itemCount]
      properties:
        id: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/IncidentStatus" }
        severity: { $ref: "#/components/schemas/IncidentSeverity" }
        summary: { type: string, description: "Markdown; the drafted report lands here." }
        createdBy: { type: string }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
        itemCount: { type: integer }
    IncidentItem:
      type: object
      required: [id, kind, addedBy, addedAt, at]
      properties:
        id: { type: string }
        kind: { type: string, enum: [alarm, event, evidence, note] }
        refId: { type: string, description: "Empty for notes and restricted items." }
        note: { type: string }
        addedBy: { type: string }
        addedAt: { type: integer, format: int64 }
        at: { type: integer, format: int64, description: "When the underlying thing happened (Unix ms); the chronology sorts on it." }
        restricted: { type: boolean, description: "The object lies outside the caller's camera scope." }
        missing: { type: boolean, description: "The object no longer exists." }
        alarm: { $ref: "#/components/schemas/Alarm" }
        event: { $ref: "#/components/schemas/Event" }
        evidence: { $ref: "#/components/schemas/Evidence" }
    Evidence:
      type: object
      required: [id, caseId, cameraId, cameraName, title, range, size, sha256, lockedAt, lockedBy]
      properties:
        id: { type: string }
        caseId: { type: string }
        alarmId: { type: string }
        cameraId: { type: string }
        cameraName: { type: string }
        title: { type: string }
        range: { type: string }
        size: { type: integer, format: int64 }
        sha256: { type: string }
        lockedAt: { type: integer, format: int64 }
        lockedBy: { type: string }
        recorderId: { type: string, description: recording server holding the file }
    EvidenceCase:
      description: An evidence case with its exported range and note (the Exports workspace).
      allOf:
        - $ref: "#/components/schemas/Evidence"
        - type: object
          required: [note, fromMs, toMs, recorderId, source]
          properties:
            note: { type: string }
            fromMs: { type: integer, format: int64, description: Unix ms; 0 when unknown (locked from an alarm) }
            toMs: { type: integer, format: int64 }
            recorderId: { type: string }
            source: { type: string, enum: [export, upload], description: "upload = a video uploaded from a phone (POST /api/v2/evidence/uploads)" }
            uploadedBy: { type: string, description: uploads only }
            device: { type: string, description: "uploads only: the device it came from" }
            recordedAt: { type: integer, format: int64, description: "uploads only: Unix ms it was filmed, when known" }
            eventId: { type: string, description: "uploads only: the event it was attached to" }
    ShareLink:
      type: object
      required: [id, evidenceId, caseId, title, note, expiresAt, maxUses, uses, createdBy, createdAt, revokedAt, status]
      properties:
        id: { type: string }
        evidenceId: { type: string }
        caseId: { type: string }
        title: { type: string }
        note: { type: string }
        expiresAt: { type: integer, format: int64, description: Unix ms }
        maxUses: { type: integer, description: 0 = unlimited }
        uses: { type: integer }
        createdBy: { type: string }
        createdAt: { type: integer, format: int64 }
        revokedAt: { type: integer, format: int64, description: Unix ms; 0 = not revoked }
        status: { type: string, enum: [active, expired, revoked, used up] }

    ExportRegion:
      type: object
      description: A normalized rectangle of the video frame (0-1, origin top left), at least 0.01 wide and tall.
      required: [x0, y0, x1, y1]
      properties:
        x0: { type: number, minimum: 0, maximum: 1 }
        y0: { type: number, minimum: 0, maximum: 1 }
        x1: { type: number, minimum: 0, maximum: 1, description: Greater than x0 }
        y1: { type: number, minimum: 0, maximum: 1, description: Greater than y0 }

    ExportJob:
      type: object
      required: [taskId, state, progress, cameraId, fromMs, toMs, dest]
      properties:
        taskId: { type: string, description: The id of the matching entry in the tasks list (kind export) }
        state: { type: string, enum: [running, done, failed, canceled] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        error: { type: string }
        cameraId: { type: string }
        fromMs: { type: integer, format: int64 }
        toMs: { type: integer, format: int64 }
        dest: { type: string, enum: [download, evidence] }
        downloadUrl: { type: string, description: "dest download, once done: GET /api/v2/export-jobs/{taskId}/download (kept 30 minutes)" }
        filename: { type: string }
        evidenceId: { type: string, description: "dest evidence, once done: the evidence case's id" }
        caseId: { type: string }

    EdgeRecovery:
      type: object
      required: [taskId, state, progress, cameraId, fromMs, toMs, gaps, pieces, recovered, skipped, seconds]
      properties:
        taskId: { type: string, description: The id of the matching entry in the tasks list (kind export) }
        state: { type: string, enum: [running, done, failed, canceled] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        error: { type: string, description: "why it failed; on a done job, a note that some pieces failed" }
        cameraId: { type: string }
        fromMs: { type: integer, format: int64 }
        toMs: { type: integer, format: int64 }
        gaps: { type: integer, description: holes found in the local recordings }
        pieces: { type: integer, description: footage pieces to fetch from the camera (known once the camera answered) }
        recovered: { type: integer, description: segments written }
        skipped: { type: integer, description: pieces that brought nothing (no footage on the card there, or local footage appeared meanwhile) }
        seconds: { type: number, description: footage recovered }

    ExportSchedule:
      type: object
      required: [id, name, cameraId, days, start, end, dest, enabled, createdBy, createdAt, lastRunAt, lastStatus]
      properties:
        id: { type: string }
        name: { type: string, maxLength: 100 }
        cameraId: { type: string }
        days:
          type: array
          description: Days a window starts on, 0 = Sunday … 6 = Saturday.
          items: { type: integer, minimum: 0, maximum: 6 }
        start: { type: string, description: "HH:MM, server local time" }
        end: { type: string, description: "HH:MM (or 24:00), server local time; an end before the start runs overnight into the next day" }
        dest: { type: string, enum: [evidence] }
        enabled: { type: boolean }
        createdBy: { type: string }
        createdAt: { type: integer, format: int64 }
        lastRunAt: { type: integer, format: int64, description: End of the last window handled, Unix ms; 0 = never }
        lastStatus: { type: string, description: '"running", "ok" or "failed: …"; empty before the first run' }

    # events
    Event:
      type: object
      required: [id, cameraId, kind, score, createdAt, hasThumbnail]
      properties:
        id: { type: string }
        cameraId: { type: string }
        kind: { type: string, description: "Motion, Person, Vehicle, Animal, Line crossing (label = object class), audio, …" }
        label: { type: string }
        score: { type: number }
        box:
          type: array
          description: normalized [x1, y1, x2, y2]
          items: { type: number }
          minItems: 4
          maxItems: 4
        createdAt: { type: integer, format: int64 }
        hasThumbnail: { type: boolean }
        alarmId: { type: string }
        description: { type: string, description: AI scene description }
        threat: { type: string, enum: [none, low, elevated, high] }
        anomaly: { type: boolean }
        reason: { type: string }
        tags: { type: array, items: { type: string } }
        trackId: { type: string, description: "object track the detection belongs to (wave16-tracking); events of one track share it" }
        personId: { type: string, description: "matched person (wave16-faces)" }
        personName: { type: string, description: "the person's name when matched" }
        plate: { type: string, description: "plate read on a vehicle event, normalized A–Z0–9 (wave16-plates)" }
    EventSearchFilter:
      type: object
      description: An event search as the filter bar holds it (times in Unix ms).
      properties:
        cameras: { type: array, items: { type: string } }
        kinds: { type: array, items: { type: string } }
        labels: { type: array, items: { type: string } }
        from: { type: integer, format: int64 }
        to: { type: integer, format: int64 }
        minScore: { type: number }
        threats: { type: array, items: { type: string } }
        anomaly: { type: boolean }
        q: { type: string }
        plate: { type: string }
        person: { type: string }
        track: { type: string }
    FacetCount:
      type: object
      required: [value, count]
      properties:
        value: { type: string }
        count: { type: integer }
    EventFacets:
      type: object
      required: [kinds, labels, threats, aiEnabled]
      properties:
        kinds: { type: array, items: { $ref: "#/components/schemas/FacetCount" } }
        labels: { type: array, items: { $ref: "#/components/schemas/FacetCount" } }
        threats: { type: array, items: { $ref: "#/components/schemas/FacetCount" } }
        aiEnabled: { type: boolean, description: "Whether /events/ask is available (AI on, key saved)." }

    # wave16: detection depth
    Model:
      type: object
      required: [id, title, purpose, file, sizeBytes, license, bundled, installed, state]
      properties:
        id: { type: string, example: yolox-s }
        title: { type: string, example: "YOLOX-S (640, more accurate)" }
        purpose: { type: string, enum: [detector, reid, audio, face-detect, face-embed, plate-det, plate-rec, clip-image, clip-text] }
        file: { type: string, description: "file name under the models directory" }
        sizeBytes: { type: integer, format: int64 }
        license: { type: string, example: Apache-2.0 }
        source: { type: string, description: "where it is downloaded from (URL)" }
        note: { type: string, description: "one line: what it is for and what it needs" }
        bundled: { type: boolean, description: "ships with the install; cannot be deleted" }
        installed: { type: boolean }
        state: { type: string, enum: [missing, downloading, installed, corrupt], description: "corrupt = a file is present but its SHA-256 does not match" }
        download: { $ref: "#/components/schemas/ModelDownload" }
    ModelDownload:
      type: object
      required: [modelId, taskId, state, done, total]
      properties:
        modelId: { type: string }
        taskId: { type: string }
        state: { type: string, enum: [running, done, failed, canceled] }
        done: { type: integer, format: int64, description: bytes }
        total: { type: integer, format: int64, description: "bytes; 0 = unknown" }
        error: { type: string }
        startedAt: { type: integer, format: int64 }
        finishedAt: { type: integer, format: int64 }
    DetectorSettings:
      type: object
      required: [model, rate, status]
      properties:
        model: { type: string, description: "catalog id as saved; \"\" = yolox-tiny" }
        rate: { type: integer, description: "0 = auto" }
        status:
          type: object
          required: [model, engine, effectiveRate, pending]
          properties:
            model: { type: string, description: "catalog id of the model actually loaded" }
            engine: { type: string, description: "CPU | OpenVINO | CoreML (DetectorInfo.engine)" }
            device: { type: string }
            effectiveRate: { type: integer, description: "passes per second per camera in use" }
            pending: { type: boolean, description: "the saved model differs from the loaded one until the detector restarts" }
            reason: { type: string, description: "why the saved model is not running (missing, corrupt, failed to load)" }
            inferMs: { type: number, description: "mean inference time, last minute" }
    FacesStatus:
      type: object
      required: [enabled, available, people, unassigned, unassignedDays]
      properties:
        enabled: { type: boolean }
        available: { type: boolean, description: "both face models installed and loaded" }
        reason: { type: string, description: "why faces can't run (which model is missing, runtime missing, model failed its test run)" }
        detectModel: { type: string }
        embedModel: { type: string }
        people: { type: integer }
        unassigned: { type: integer }
        unassignedDays: { type: integer }
    Person:
      type: object
      required: [id, name, alert, faces, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        notes: { type: string }
        alert: { $ref: "#/components/schemas/WatchAlert" }
        faces: { type: array, items: { $ref: "#/components/schemas/Face" } }
        lastSeenAt: { type: integer, format: int64, description: "Unix ms of the newest matched event" }
        lastSeenCameraId: { type: string }
        createdAt: { type: integer, format: int64 }
    PersonInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        notes: { type: string, maxLength: 500 }
        alert: { $ref: "#/components/schemas/WatchAlert" }
    WatchAlert:
      type: string
      enum: [default, never, always]
      description: |
        What a match does to the event's alarm. `default`: the Person or
        Vehicle alarm keeps its severity and the name or plate goes into
        its detail. `never`: the alarm is closed with a note (a known
        person or vehicle). `always`: a Critical Watchlist alarm is raised.
    Face:
      type: object
      required: [id, eventId, cameraId, at, score]
      properties:
        id: { type: string }
        eventId: { type: string }
        cameraId: { type: string }
        at: { type: integer, format: int64, description: Unix ms }
        box: { type: array, items: { type: number }, minItems: 4, maxItems: 4, description: "normalized to the thumbnail" }
        score: { type: number, description: detector confidence }
        personId: { type: string }
        similarity: { type: number, description: "cosine similarity to the matched person, when matched" }
    LPRStatus:
      type: object
      required: [enabled, available, plates]
      properties:
        enabled: { type: boolean }
        available: { type: boolean }
        reason: { type: string }
        detModel: { type: string }
        recModel: { type: string }
        plates: { type: integer, description: watchlist size }
        readLast24h: { type: integer, description: "vehicle events with a plate in the last 24 h" }
    Plate:
      type: object
      required: [id, plate, alert, createdAt]
      properties:
        id: { type: string }
        plate: { type: string, description: "normalized, A–Z0–9" }
        name: { type: string, description: "who it belongs to, e.g. \"Delivery van\"" }
        notes: { type: string }
        alert: { $ref: "#/components/schemas/WatchAlert" }
        lastSeenAt: { type: integer, format: int64 }
        lastSeenCameraId: { type: string }
        sightings: { type: array, items: { $ref: "#/components/schemas/Event" }, description: "newest 20 events with this plate (GET one plate only)" }
        createdAt: { type: integer, format: int64 }
    PlateInput:
      type: object
      additionalProperties: false
      properties:
        plate: { type: string, minLength: 2, maxLength: 12, description: "required on POST; normalized" }
        name: { type: string, maxLength: 80 }
        notes: { type: string, maxLength: 500 }
        alert: { $ref: "#/components/schemas/WatchAlert" }
    SemanticStatus:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
        reason: { type: string, description: "why semantic search is unavailable (which model is missing, tokenizer files missing, runtime missing, model failed its test run)" }
        model: { type: string }
        indexed: { type: integer, description: "events with a vector from the current model" }
        backfill: { $ref: "#/components/schemas/AppearanceBackfill" }
    SemanticHit:
      type: object
      required: [event, score]
      properties:
        event: { $ref: "#/components/schemas/Event" }
        score: { type: number, description: "cosine similarity, 0..1" }
    # rules
    Rule:
      allOf:
        - $ref: "#/components/schemas/RuleInput"
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: { type: string }
            createdAt: { type: integer, format: int64 }
            updatedAt: { type: integer, format: int64 }
    RuleInput:
      type: object
      additionalProperties: false
      required: [name, enabled, cameraIds, kinds, minSeverity, schedule, fromMinute, toMinute, days, delivery, instructions]
      properties:
        name: { type: string }
        enabled: { type: boolean }
        cameraIds: { type: array, items: { type: string }, description: "empty = every camera" }
        kinds: { type: array, items: { type: string }, description: "empty = any alarm" }
        minSeverity: { type: string, enum: [Info, Warning, Critical] }
        schedule: { type: boolean }
        fromMinute: { type: integer, minimum: 0, maximum: 1439 }
        toMinute: { type: integer, minimum: 0, maximum: 1439 }
        days: { type: array, items: { type: integer, minimum: 0, maximum: 6 } }
        delivery: { type: string }
        instructions: { type: string }
        timeProfileId: { type: string, description: "Optional. Outside this time profile the rule doesn't fire." }
        actions:
          type: array
          description: Optional. Run when the rule fires, besides its alarm behavior.
          items: { $ref: "#/components/schemas/RuleAction" }
    RuleAction:
      type: object
      additionalProperties: false
      required: [type, webhookId]
      properties:
        type: { type: string, enum: [webhook] }
        webhookId: { type: string }
    RuleDraft:
      type: object
      required: [rule, explanation, warnings]
      properties:
        rule: { $ref: "#/components/schemas/RuleInput" }
        explanation: { type: string, description: "One sentence in plain English on what the rule will do." }
        warnings: { type: array, items: { type: string }, description: "What the server could not resolve or what needs a check, such as an unknown camera name." }
    RuleTemplate:
      type: object
      required: [id, category, title, summary, rule]
      properties:
        id: { type: string }
        category: { type: string, enum: [security, health, operations] }
        title: { type: string }
        summary: { type: string }
        rule: { $ref: "#/components/schemas/RuleInput" }
    Insights:
      type: object
      required: [from, to, totals, daily, cameras, mix, recommendations]
      properties:
        from: { type: integer, format: int64 }
        to: { type: integer, format: int64 }
        totals:
          type: object
          required: [events, alarms, camerasWithAlarms, offlineCameras]
          properties:
            events: { type: integer }
            alarms: { type: integer }
            camerasWithAlarms: { type: integer }
            offlineCameras: { type: integer, description: "Cameras with at least one Camera Offline alarm in the range." }
        daily:
          type: array
          description: Every local day in the range, oldest first, zero-filled.
          items:
            type: object
            required: [day, events, alarms, byKind]
            properties:
              day: { type: string, description: "Local date, YYYY-MM-DD." }
              events: { type: integer }
              alarms: { type: integer }
              byKind: { type: object, additionalProperties: { type: integer } }
        cameras:
          type: array
          description: Up to 10 cameras, most alarms first.
          items:
            type: object
            required: [cameraId, name, alarms, alertOn]
            properties:
              cameraId: { type: string }
              name: { type: string }
              alarms: { type: integer }
              topKind: { type: string }
              alertOn: { $ref: "#/components/schemas/AlertOn" }
        mix:
          type: array
          description: Alarm kinds in the range, most alarms first.
          items:
            type: object
            required: [kind, alarms, share]
            properties:
              kind: { type: string }
              alarms: { type: integer }
              share: { type: number, minimum: 0, maximum: 1 }
        recommendations:
          type: array
          description: At most 6, most urgent first.
          items: { $ref: "#/components/schemas/Recommendation" }
    Recommendation:
      type: object
      required: [id, level, title, detail]
      properties:
        id: { type: string, description: "Stable per rule and camera, for example motion-only:cam-7." }
        level: { type: string, enum: [attention, suggestion, info] }
        title: { type: string }
        detail: { type: string }
        cameraId: { type: string }
        action: { $ref: "#/components/schemas/RecommendationAction" }
    RecommendationAction:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [setAlertOn, openTemplate, openCamera, openStorage] }
        cameraId: { type: string, description: "For setAlertOn and openCamera." }
        alertOn: { $ref: "#/components/schemas/AlertOn" }
        templateId: { type: string, description: "For openTemplate." }
    TimeProfile:
      allOf:
        - $ref: "#/components/schemas/TimeProfileInput"
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: string }
            createdAt: { type: integer, format: int64 }
    TimeProfileInput:
      type: object
      additionalProperties: false
      required: [name, weekly]
      properties:
        name: { type: string }
        weekly:
          type: array
          description: Weekly windows in the management server's local time. An `end` before `start` runs past midnight and belongs to the day it started; `24:00` is end of day.
          items:
            type: object
            additionalProperties: false
            required: [days, start, end]
            properties:
              days: { type: array, items: { type: integer, minimum: 0, maximum: 6 }, description: 0 = Sunday }
              start: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', example: "08:00" }
              end: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', example: "17:30" }
    Webhook:
      type: object
      required: [id, name, url, events, enabled, hasSecret, lastStatus, lastFiredAt, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string }
        events: { type: array, items: { type: string, enum: [alarm.new, alarm.state, event.new, recorder.online] }, description: "Event-kind subscriptions; empty = fires only for rule actions." }
        enabled: { type: boolean }
        hasSecret: { type: boolean, description: "The secret is write-only; this says only whether one is set." }
        lastStatus: { type: string, description: 'Latest delivery, "" = never.' }
        lastFiredAt: { type: integer, format: int64, description: "Epoch ms, 0 = never." }
        createdAt: { type: integer, format: int64 }
    WebhookInput:
      type: object
      additionalProperties: false
      required: [name, url]
      properties:
        name: { type: string }
        url: { type: string, description: "Absolute http:// or https:// address; TLS certificates are always verified." }
        secret: { type: string, description: 'Signs deliveries (X-Sentinel-Signature: sha256=HMAC-SHA256(body)). Absent = keep, "" = clear.' }
        events: { type: array, items: { type: string, enum: [alarm.new, alarm.state, event.new, recorder.online] } }
        enabled: { type: boolean, default: true }

    # system
    RecordingServer:
      type: object
      required: [id, name, online, version, configRev, mediaRunning, cameras, capabilities, local, publicUrl, enrolledAt, lastSeenAt, revoked, recordingsDir]
      properties:
        id: { type: string }
        name: { type: string }
        local: { type: boolean, description: runs inside the management server's process }
        publicUrl: { type: string }
        enrolledAt: { type: integer, format: int64 }
        lastSeenAt: { type: integer, format: int64 }
        revoked: { type: boolean }
        online: { type: boolean }
        storage:
          type: object
          required: [recordingsBytes]
          description: only while online
          properties:
            recordingsDir: { type: string, description: the folder in use right now on that server }
            diskFreeBytes: { type: integer, format: int64, description: free space on the disk that holds the recordings folder }
            diskTotalBytes: { type: integer, format: int64 }
            recordingsBytes: { type: integer, format: int64 }
        recordingsDir: { type: string, description: 'configured recordings folder on that server; "" = <its data directory>/recordings' }
        version: { type: string }
        configRev: { type: integer, format: int64 }
        mediaRunning: { type: boolean }
        mediaError: { type: string }
        cameras: { type: integer, description: cameras assigned }
        capabilities:
          type: object
          required: [detection, objects, webrtc]
          properties:
            detection: { type: boolean }
            objects: { type: boolean }
            webrtc: { type: boolean }

    ServerHealth:
      type: object
      required: [id, name, online, version, cameras, latencyMs, cpu, mem, disk, dbBytes, uptimeSec]
      properties:
        id: { type: string }
        name: { type: string }
        online: { type: boolean }
        latencyMs: { type: integer, format: int64, nullable: true, description: control-link round trip of the health query }
        cpu: { type: number, nullable: true, description: "1-minute load average as a percent of the cores (0 to 100); null when unknown" }
        mem:
          nullable: true
          type: object
          required: [used, total]
          properties:
            used: { type: integer, format: int64 }
            total: { type: integer, format: int64 }
        disk:
          nullable: true
          type: object
          required: [used, free, total]
          properties:
            used: { type: integer, format: int64 }
            free: { type: integer, format: int64 }
            total: { type: integer, format: int64 }
        dbBytes: { type: integer, format: int64, nullable: true }
        uptimeSec: { type: integer, format: int64, nullable: true }
        version: { type: string }
        cameras: { type: array, items: { $ref: "#/components/schemas/CameraHealth" } }

    CameraHealth:
      type: object
      required: [id, name, online, recording, lastSegmentAgeSec, kbps]
      properties:
        id: { type: string }
        name: { type: string }
        online: { type: boolean }
        recording: { type: boolean }
        lastSegmentAgeSec: { type: integer, format: int64, nullable: true, description: age of the newest recording file, measured on the recorder }
        kbps: { type: number, nullable: true, description: ingest rate from the media layer's byte counter between two readings }
        recordingMode: { type: string, enum: [continuous, events, dual, "off"], description: "effective recording mode (always sent by this server); lastSegmentAgeSec then measures the stream that always records (events: the rolling buffer, dual: the low-res stream)" }
        lastKeptClipAt: { type: string, format: date-time, description: "events/dual: when the newest kept full-res clip ends; absent = none yet" }

    EnrollmentToken:
      type: object
      required: [token, expiresAt, command]
      properties:
        token: { type: string, description: "one-time; embeds the management server's CA fingerprint so the new server can pin it" }
        expiresAt: { type: integer, format: int64 }
        command: { type: string, description: "e.g. sentinel --role recording --management https://ms.lan:8091 --enroll <token>" }

    DiscoveredDevice:
      type: object
      required: [host, name, source, added]
      properties:
        host: { type: string }
        name: { type: string }
        manufacturer: { type: string }
        model: { type: string }
        serviceURL: { type: string, description: 'ONVIF device service; "" if unknown' }
        source: { type: string, enum: [onvif, sweep] }
        openPorts: { type: array, items: { type: integer }, description: sweep only }
        added: { type: boolean, description: a configured camera anywhere on the site already uses this host }
    DiscoverResult:
      type: object
      required: [devices]
      properties:
        devices: { type: array, items: { $ref: "#/components/schemas/DiscoveredDevice" } }
        subnets: { type: array, items: { type: string }, description: subnets swept, when sweeping }
        warnings: { type: array, items: { type: string } }
    OnvifProfile:
      type: object
      required: [token, name, width, height, fps, encoding, rtspURL]
      properties:
        token: { type: string }
        name: { type: string }
        width: { type: integer }
        height: { type: integer }
        fps: { type: integer }
        encoding: { type: string, description: H264, H265, JPEG, or "" }
        rtspURL: { type: string, description: without credentials }
    ProbeOutcome:
      type: object
      description: Success carries `details`; failure carries `error` (the camera, not the API, failed).
      properties:
        details:
          type: object
          required: [manufacturer, model, firmware, serial, serviceURL, profiles]
          properties:
            manufacturer: { type: string }
            model: { type: string }
            firmware: { type: string }
            serial: { type: string }
            serviceURL: { type: string }
            profiles: { type: array, items: { $ref: "#/components/schemas/OnvifProfile" } }
        mainURL: { type: string, description: recommended recording stream }
        subURL: { type: string, description: recommended live-view stream }
        error: { type: string }
        authFailed: { type: boolean, description: the camera rejected the username or password }
        suggestedURL: { type: string, description: an RTSP address to try by hand when ONVIF fails }

    # groups
    CameraGroup:
      type: object
      required: [id, name, cameraIds, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        cameraIds: { type: array, items: { type: string } }
        createdAt: { type: integer, format: int64 }
    CameraGroupInput:
      type: object
      additionalProperties: false
      required: [name, cameraIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        cameraIds: { type: array, items: { type: string } }

    # floorplans
    FloorplanPin:
      type: object
      additionalProperties: false
      required: [cameraId, x, y, heading]
      properties:
        cameraId: { type: string }
        x: { type: number, minimum: 0, maximum: 1, description: fraction of the image width }
        y: { type: number, minimum: 0, maximum: 1, description: fraction of the image height }
        heading: { type: number, description: "degrees clockwise from up (0-359), -1 = none" }
    Floorplan:
      type: object
      required: [id, name, sortOrder, width, height, mime, updatedAt, pins]
      properties:
        id: { type: string }
        name: { type: string }
        sortOrder: { type: integer }
        width: { type: integer, description: image width in pixels }
        height: { type: integer, description: image height in pixels }
        mime: { type: string }
        updatedAt: { type: integer, format: int64 }
        pins: { type: array, items: { $ref: "#/components/schemas/FloorplanPin" } }
    FloorplanPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        sortOrder: { type: integer }

    # bookmarks
    BookmarkColor:
      type: string
      enum: [red, orange, yellow, green, teal, blue, purple, pink, gray]
      description: palette token; an empty color on write means blue
    Bookmark:
      type: object
      required: [id, cameraId, atMs, durationMs, title, note, color, createdBy, createdAt, canEdit]
      properties:
        id: { type: string }
        cameraId: { type: string }
        atMs: { type: integer, format: int64, description: start, Unix ms }
        durationMs: { type: integer, format: int64, minimum: 0, maximum: 86400000, description: "0 = a point, >0 = a range from atMs" }
        title: { type: string, maxLength: 120 }
        note: { type: string, maxLength: 2000 }
        color: { $ref: "#/components/schemas/BookmarkColor" }
        createdBy: { type: string, description: ID of the user who added it }
        createdAt: { type: integer, format: int64, description: Unix ms }
        canEdit: { type: boolean, description: whether the caller may edit or delete it (author or manager) }
    BookmarkInput:
      type: object
      additionalProperties: false
      required: [atMs]
      properties:
        atMs: { type: integer, format: int64, minimum: 1 }
        durationMs: { type: integer, format: int64, minimum: 0, maximum: 86400000 }
        title: { type: string, maxLength: 120 }
        note: { type: string, maxLength: 2000 }
        color: { type: string, description: "a BookmarkColor token, or empty for the default" }
    BookmarkPatch:
      type: object
      additionalProperties: false
      properties:
        atMs: { type: integer, format: int64, minimum: 1 }
        durationMs: { type: integer, format: int64, minimum: 0, maximum: 86400000 }
        title: { type: string, maxLength: 120 }
        note: { type: string, maxLength: 2000 }
        color: { type: string, description: "a BookmarkColor token, or empty for the default" }

    # audit
    AuditEntry:
      type: object
      required: [id, at, user, area, action, detail, serverId]
      properties:
        id: { type: string }
        at: { type: integer, format: int64 }
        user: { type: string }
        area: { type: string }
        action: { type: string }
        detail: { type: string }
        serverId: { type: string, description: '"" = the management server; else the recording server that forwarded it' }
    AuditVerify:
      type: object
      required: [ok, entries, servers]
      properties:
        ok: { type: boolean }
        entries: { type: integer }
        brokenAt: { type: string, description: id of the first entry that doesn't verify }
        servers:
          type: array
          description: forwarded chains, one per recording server
          items:
            type: object
            required: [serverId, ok, entries]
            properties:
              serverId: { type: string }
              ok: { type: boolean }
              entries: { type: integer }

    # directory
    AuthProviders:
      type: object
      required: [local, ldap, oidc]
      properties:
        local: { type: boolean }
        ldap: { type: boolean, description: "names and passwords are also checked against the directory" }
        oidc:
          type: object
          required: [enabled]
          properties:
            enabled: { type: boolean }
            displayName: { type: string, example: "Sign in with Contoso" }
    RoleMapping:
      type: object
      required: [group, role]
      properties:
        group: { type: string, description: "LDAP group DN or OIDC group/role claim value" }
        role: { $ref: "#/components/schemas/Role" }
        groupIds: { type: array, items: { type: string }, description: "camera groups to scope to; empty = all cameras" }
    LDAPSettings:
      type: object
      additionalProperties: false
      required: [enabled, url]
      properties:
        enabled: { type: boolean }
        url: { type: string, example: "ldaps://dc1.corp.example:636" }
        startTls: { type: boolean }
        insecureSkipVerify: { type: boolean }
        bindDn: { type: string }
        bindPassword: { type: string, writeOnly: true }
        hasBindPassword: { type: boolean, readOnly: true }
        userBaseDn: { type: string }
        userFilter: { type: string, example: "(&(objectClass=user)(sAMAccountName={name}))" }
        groupAttribute: { type: string, default: memberOf }
        roleMappings: { type: array, items: { $ref: "#/components/schemas/RoleMapping" } }
    OIDCSettings:
      type: object
      additionalProperties: false
      required: [enabled, issuer, clientId]
      properties:
        enabled: { type: boolean }
        displayName: { type: string }
        issuer: { type: string }
        clientId: { type: string }
        clientSecret: { type: string, writeOnly: true }
        hasClientSecret: { type: boolean, readOnly: true }
        scopes: { type: array, items: { type: string }, default: [openid, profile, email] }
        usernameClaim: { type: string, default: preferred_username }
        groupsClaim: { type: string, default: groups }
        roleMappings: { type: array, items: { $ref: "#/components/schemas/RoleMapping" } }
        publicUrl: { type: string, description: "this server's external URL, for the callback (default: from the request)" }
    DirectorySettings:
      type: object
      additionalProperties: false
      required: [ldap, oidc]
      properties:
        ldap: { $ref: "#/components/schemas/LDAPSettings" }
        oidc: { $ref: "#/components/schemas/OIDCSettings" }
    OidcCodeGrant:
      type: object
      additionalProperties: false
      required: [grantType, code]
      properties:
        grantType: { const: oidc_code }
        code: { type: string }
        client: { type: string, maxLength: 100 }

    # views
    ViewTile:
      type: object
      required: [cameraId]
      properties:
        cameraId: { type: string }
        x: { type: integer, minimum: 0 }
        y: { type: integer, minimum: 0 }
        w: { type: integer, minimum: 1, default: 1 }
        h: { type: integer, minimum: 1, default: 1 }
    ViewInput:
      type: object
      additionalProperties: false
      required: [name, columns, rows, tiles]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        columns: { type: integer, minimum: 1, maximum: 8 }
        rows: { type: integer, minimum: 1, maximum: 8 }
        tiles: { type: array, items: { $ref: "#/components/schemas/ViewTile" }, maxItems: 64 }
        shared: { type: boolean, description: "In the Shared tree (needs ManageViews). Default false." }
        groupId: { type: string, description: "Folder of a shared view (needs shared: true)." }
        sortOrder: { type: integer, description: "Order among shared views and folders (shared only)." }
    ViewGroupInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        parentId: { type: string, description: 'Parent folder; "" or absent = top level.' }
        sortOrder: { type: integer }
    ViewGroup:
      type: object
      required: [id, parentId, name, sortOrder]
      properties:
        id: { type: string }
        parentId: { type: string }
        name: { type: string }
        sortOrder: { type: integer }
    View:
      allOf:
        - $ref: "#/components/schemas/ViewInput"
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: { type: string }
            createdAt: { type: integer, format: int64 }
            updatedAt: { type: integer, format: int64 }

    # import
    MacImport:
      type: object
      additionalProperties: false
      required: [sourceVersion, cameras, users, rules, evidence, audit]
      properties:
        sourceVersion: { type: string, example: "1.1.2" }
        cameras:
          type: array
          items:
            type: object
            required: [sourceId, name, rtspUrl]
            properties:
              sourceId: { type: string, description: UUID in the Mac app }
              name: { type: string }
              location: { type: string }
              rtspUrl: { type: string }
              subRtspUrl: { type: string }
              username: { type: string }
              password: { type: string }
              recording: { type: boolean }
              retentionDays: { type: integer }
              motionLevel: { type: integer }
              onvifUrl: { type: string }
              recordingsPath: { type: string, description: "Mac folder with this camera's recordings; the local recording server indexes it read-only" }
              recordingMode: { type: string, enum: [continuous, events, dual, "off"], description: "the Mac app mode mapped by the importer (motion → events, dualStream → dual); absent = the server default; dual without subRtspUrl becomes events" }
        users:
          type: array
          items:
            type: object
            required: [name, role]
            properties:
              name: { type: string }
              role: { $ref: "#/components/schemas/Role" }
              passwordHash: { type: string, description: "bcrypt, if the Mac app had one; else the user must get a password from an Admin" }
        rules: { type: array, items: { $ref: "#/components/schemas/RuleInput" } }
        evidence:
          type: array
          items:
            type: object
            required: [caseId, cameraName, title, range, size, sha256, lockedAt, lockedBy]
            properties:
              caseId: { type: string }
              cameraSourceId: { type: string }
              cameraName: { type: string }
              title: { type: string }
              range: { type: string }
              size: { type: integer, format: int64 }
              sha256: { type: string }
              lockedAt: { type: integer, format: int64 }
              lockedBy: { type: string }
        audit:
          type: array
          items:
            type: object
            required: [at, user, area, action, detail]
            properties:
              at: { type: integer, format: int64 }
              user: { type: string }
              area: { type: string }
              action: { type: string }
              detail: { type: string }
    MacImportResult:
      type: object
      required: [cameras, users, rules, evidence, audit, skipped, cameraIds]
      properties:
        cameras: { type: integer }
        users: { type: integer }
        rules: { type: integer }
        evidence: { type: integer, description: entries imported; files still to upload }
        audit: { type: integer }
        skipped: { type: array, items: { type: string }, description: what wasn't imported and why }
        cameraIds:
          type: object
          additionalProperties: { type: string }
          description: Mac sourceId → new camera id
    RoleDefinition:
      type: object
      required: [id, name, description, permissions, builtin, createdAt, userCount]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        permissions: { type: array, items: { type: string }, description: Permission ids from /api/v2/permissions. }
        builtin: { type: boolean }
        createdAt: { type: integer, format: int64, description: Unix seconds. }
        userCount: { type: integer }
    RoleInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        permissions: { type: array, items: { type: string } }
    PermissionInfo:
      type: object
      required: [id, label, group, description]
      properties:
        id: { type: string }
        label: { type: string }
        group: { type: string }
        description: { type: string }
    SiteInfo:
      type: object
      additionalProperties: false
      required: [name, description, contact]
      properties:
        name: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        contact: { type: string, maxLength: 200 }
    MonitorThreshold:
      type: object
      additionalProperties: false
      required: [amber, red]
      properties:
        amber: { type: integer, minimum: 1, maximum: 99 }
        red: { type: integer, minimum: 2, maximum: 100 }
    MonitorThresholds:
      type: object
      additionalProperties: false
      required: [cpu, mem, disk]
      properties:
        cpu: { $ref: "#/components/schemas/MonitorThreshold" }
        mem: { $ref: "#/components/schemas/MonitorThreshold" }
        disk: { $ref: "#/components/schemas/MonitorThreshold" }
    SystemTask:
      type: object
      required: [id, kind, title, state, progress, startedAt, finishedAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [discovery, export, import, appearance, model-download, semantic] }
        title: { type: string }
        state: { type: string, enum: [running, done, failed] }
        progress: { type: integer, minimum: -1, maximum: 100, description: "0-100, or -1 when indeterminate" }
        startedAt: { type: integer, format: int64, description: Unix ms }
        finishedAt: { type: integer, format: int64, description: Unix ms; 0 while running }
        error: { type: string }
    ServerLogs:
      type: object
      required: [server, name, lines]
      properties:
        server: { type: string }
        name: { type: string }
        lines:
          type: array
          items:
            type: object
            required: [level, text]
            properties:
              level: { type: string, enum: [DEBUG, INFO, WARN, ERROR] }
              text: { type: string }
    ConfigReport:
      type: object
      description: Allow-listed snapshot; sections are arrays of plain objects (see the Configuration Report page for their fields).
      required: [generatedAt, versions, site, thresholds, servers, cameras, groups, users, roles, rules, timeProfiles, webhooks]
      properties:
        generatedAt: { type: string, format: date-time }
        versions: { type: object, additionalProperties: true }
        site: { $ref: "#/components/schemas/SiteInfo" }
        thresholds: { $ref: "#/components/schemas/MonitorThresholds" }
        servers: { type: array, items: { type: object, additionalProperties: true } }
        cameras: { type: array, items: { type: object, additionalProperties: true } }
        groups: { type: array, items: { type: object, additionalProperties: true } }
        users: { type: array, items: { type: object, additionalProperties: true } }
        roles: { type: array, items: { type: object, additionalProperties: true } }
        rules: { type: array, items: { type: object, additionalProperties: true } }
        timeProfiles: { type: array, items: { type: object, additionalProperties: true } }
        webhooks: { type: array, items: { type: object, additionalProperties: true } }

    # zones & privacy masks
    ZonePolygon:
      type: array
      minItems: 3
      maxItems: 20
      description: Polygon vertices [x, y], normalized 0-1 against the full frame, any winding.
      items:
        type: array
        minItems: 2
        maxItems: 2
        items: { type: number, minimum: 0, maximum: 1 }
    ZoneLinePoints:
      type: array
      minItems: 2
      maxItems: 2
      description: A line's two ends p0, p1 as [x, y], normalized 0-1. Sides are relative to p0 to p1 (standing at p0 looking at p1, y grows downward).
      items:
        type: array
        minItems: 2
        maxItems: 2
        items: { type: number, minimum: 0, maximum: 1 }
    ZoneLineMeta:
      type: object
      description: Line metadata. "ltr" counts crossings from the left side of p0 to p1 to the right side, "rtl" the reverse, "both" either way. severity is the alarm severity a crossing raises; "Info" logs the Line crossing event without raising an alarm.
      properties:
        direction: { type: string, enum: [ltr, rtl, both], default: both }
        severity: { type: string, enum: [Critical, Warning, Info], default: Critical }
    CameraZone:
      type: object
      required: [id, kind, name, points, enabled, createdAt, updatedAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [detect, mask, line] }
        name: { type: string, description: "for a line, the rule name carried on its Line crossing events" }
        points:
          description: A polygon (detect, mask; 3-20 vertices) or the two ends of a line (line).
          oneOf:
            - { $ref: "#/components/schemas/ZonePolygon" }
            - { $ref: "#/components/schemas/ZoneLinePoints" }
        meta: { $ref: "#/components/schemas/ZoneLineMeta" }
        enabled: { type: boolean }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    CameraZoneInput:
      type: object
      additionalProperties: false
      required: [kind, points]
      properties:
        id: { type: string, description: "an existing zone id keeps it; omit for a new zone" }
        kind: { type: string, enum: [detect, mask, line] }
        name: { type: string, maxLength: 100 }
        points:
          description: A polygon (detect, mask) or exactly two points (line).
          oneOf:
            - { $ref: "#/components/schemas/ZonePolygon" }
            - { $ref: "#/components/schemas/ZoneLinePoints" }
        meta: { $ref: "#/components/schemas/ZoneLineMeta" }
        enabled: { type: boolean, default: true }
    CameraZonesPut:
      type: object
      additionalProperties: false
      required: [zones]
      properties:
        zones: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/CameraZoneInput" } }

    # appearance
    SimilarEventsRequest:
      type: object
      additionalProperties: false
      properties:
        from: { type: integer, format: int64, description: "Unix ms, inclusive; omit or 0 for no lower bound" }
        to: { type: integer, format: int64, description: "Unix ms, exclusive; omit or 0 for no upper bound" }
        cameras: { type: array, items: { type: string }, description: "Limit to these cameras (intersected with the caller's scope); empty = every visible camera" }
        limit: { type: integer, minimum: 1, maximum: 100, description: "Most matches returned (24 when omitted)" }
        minScore: { type: number, minimum: -1, maximum: 1, description: "Lowest cosine similarity returned" }
        anyKind: { type: boolean, description: "Compare against every event kind, not only the query's (false when omitted)" }
    SimilarEventHit:
      type: object
      required: [score, event]
      properties:
        score: { type: number, description: "Cosine similarity, -1..1 (1 = identical appearance)" }
        event: { $ref: "#/components/schemas/Event" }
    SimilarEvents:
      type: object
      required: [query, model, scanned, items]
      properties:
        query: { $ref: "#/components/schemas/Event" }
        model: { type: string, description: "Model id (sha256: + 16 hex digits of the model file)" }
        scanned: { type: integer, description: Candidate vectors compared }
        items: { type: array, items: { $ref: "#/components/schemas/SimilarEventHit" } }
    AppearanceBackfill:
      type: object
      required: [taskId, state, total, processed, indexed, skipped, startedAt]
      properties:
        taskId: { type: string }
        state: { type: string, enum: [running, done, failed, canceled] }
        total: { type: integer, description: Events to index }
        processed: { type: integer }
        indexed: { type: integer }
        skipped: { type: integer, description: "Events whose snapshot was missing or whose box was too small" }
        error: { type: string }
        startedAt: { type: integer, format: int64 }
        finishedAt: { type: integer, format: int64 }
    AppearanceStatus:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
        reason: { type: string, description: "Why appearance search is unavailable (no model installed, ONNX Runtime missing, model failed its test run)" }
        model: { type: string }
        indexed: { type: integer, description: Events with a vector from the current model }
        backfill: { $ref: "#/components/schemas/AppearanceBackfill" }
    DeviceCodeRequest:
      type: object
      additionalProperties: false
      properties:
        deviceName: { type: string, maxLength: 60, description: "Shown on the approval page, e.g. \"Lobby Apple TV\"." }
    DeviceCodeGrant:
      type: object
      required: [userCode, deviceCode, verifyUrl, verifyUrlComplete, expiresIn, expiresAt, interval]
      properties:
        userCode: { type: string, description: "8 characters shown as XXXX-XXXX, no ambiguous characters" }
        deviceCode: { type: string, description: Secret the device polls with. }
        verifyUrl: { type: string, description: "The dashboard's /link page" }
        verifyUrlComplete: { type: string, description: verifyUrl with the code filled in (for a QR code). }
        expiresIn: { type: integer, description: Seconds }
        expiresAt: { type: integer, format: int64 }
        interval: { type: integer, description: Minimum seconds between polls }
    DeviceCodeDecision:
      type: object
      additionalProperties: false
      required: [userCode]
      properties:
        userCode: { type: string, description: "As typed; case, spaces and dashes don't matter" }
    DeviceCodeInfo:
      type: object
      required: [deviceName, createdAt, expiresAt, role]
      properties:
        deviceName: { type: string }
        createdAt: { type: integer, format: int64 }
        expiresAt: { type: integer, format: int64 }
        role: { type: string, description: The most the device may do (always Viewer). }

    # wall-layouts
    WallTour:
      type: object
      additionalProperties: false
      required: [viewIds, seconds]
      properties:
        viewIds: { type: array, minItems: 1, maxItems: 32, items: { type: string }, description: saved views cycled in order }
        seconds: { type: integer, minimum: 5, maximum: 3600, description: time on each view }
    WallMonitor:
      type: object
      additionalProperties: false
      required: [slot, screenHint]
      description: >-
        One monitor window. It shows viewId or cameraIds (not both), or a tour; a tour
        may sit alongside viewId (the view it starts on).
      properties:
        slot: { type: integer, minimum: 0, maximum: 15, description: "the monitor's place in the layout (unique)" }
        screenHint: { type: string, maxLength: 200, description: "the display's name when saved (matched first)" }
        screenIndex: { type: integer, minimum: 0, maximum: 63, description: "the display's position when saved (0 = main); the fallback when no display has that name" }
        viewId: { type: string }
        cameraIds: { type: array, maxItems: 64, items: { type: string } }
        tour: { $ref: "#/components/schemas/WallTour" }
        alarmMonitor: { type: boolean, description: new alarms take this monitor over }
        fullscreen: { type: boolean }
    WallLayout:
      type: object
      required: [id, name, shared, monitors, createdBy, createdAt, updatedAt, canEdit]
      properties:
        id: { type: string }
        name: { type: string }
        shared: { type: boolean }
        monitors: { type: array, items: { $ref: "#/components/schemas/WallMonitor" } }
        createdBy: { type: string, description: ID of the user who saved it }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
        canEdit: { type: boolean, description: "whether the caller may change or delete it" }
    WallLayoutInput:
      type: object
      additionalProperties: false
      required: [name, monitors]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        shared: { type: boolean }
        monitors: { type: array, maxItems: 16, items: { $ref: "#/components/schemas/WallMonitor" } }
    WallLayoutPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        shared: { type: boolean }
        monitors: { type: array, maxItems: 16, items: { $ref: "#/components/schemas/WallMonitor" } }

    # Sentinel Cloud (WAVE12)
    CloudQuotas:
      type: object
      required: [backupBytes, backupDays, servers]
      properties:
        backupBytes: { type: integer, format: int64 }
        backupDays: { type: integer }
        servers: { type: integer }
    CloudStatus:
      type: object
      required: [linked, serverId, serverName, accountEmailMasked, plan, status, periodEnd, features, quotas, remote, push, backup, signIn]
      properties:
        linked: { type: boolean }
        serverId: { type: string, description: 'The relay id; "" when not linked.' }
        serverName: { type: string, description: "The name the owner sees on sentvms.com: the site name, else the server name." }
        accountEmailMasked: { type: string, description: 'e.g. "e***@example.com"; "" when not linked.' }
        plan: { type: string, enum: [free, cloud, business] }
        status: { type: string, enum: [inactive, active, grace, canceled] }
        uploadsAvailable: { type: boolean, description: "GET only: video uploads are allowed (plan cloud or business, active or in grace)" }
        phoneCamerasAvailable: { type: boolean, description: "GET only: iPhone cameras may be added and stream (same condition)" }
        periodEnd: { type: string, format: date-time, nullable: true, description: "null for the free plan" }
        features:
          type: array
          description: Empty unless the plan is active or in grace.
          items: { type: string, enum: [relay, push, backup] }
        quotas: { $ref: "#/components/schemas/CloudQuotas" }
        remote:
          type: object
          required: [enabled, state, url, error]
          properties:
            enabled: { type: boolean }
            state: { type: string, enum: [off, connecting, connected, retrying, inactive] }
            url: { type: string, description: 'https://<id>-cloud.sentvms.com; "" when not linked.' }
            error: { type: string }
        push:
          type: object
          required: [state]
          properties:
            state:
              type: string
              enum: [off, cloud, direct]
              description: cloud = through Sentinel Cloud's push relay; direct = the owner's own APNs key.
        backup:
          type: object
          required: [enabled, bytesUsed, objects, lastUploadAt, error]
          properties:
            enabled: { type: boolean }
            bytesUsed: { type: integer, format: int64 }
            objects: { type: integer, format: int64 }
            lastUploadAt: { type: string, format: date-time, nullable: true, description: "null before the first upload since the server started" }
            error: { type: string }
        link:
          type: object
          description: Only while a link code is pending, and only for changeSettings.
          required: [userCode, verifyURL, expiresAt]
          properties:
            userCode: { type: string, description: XXXX-XXXX }
            verifyURL: { type: string }
            expiresAt: { type: string, format: date-time }
        signIn:
          description: >-
            Sentinel Cloud's public configuration (its GET /v1/config, cached for an hour): where
            to sign in to an account and to subscribe, and the plans. null when Sentinel Cloud
            can't be reached, isn't set up on this server, or while it is first being fetched.
          oneOf:
            - { $ref: "#/components/schemas/CloudConfig" }
            - { type: "null" }
    CloudConfig:
      type: object
      required: [supabaseUrl, supabaseAnonKey, siteBase, checkoutURL, portalURL, plans]
      properties:
        supabaseUrl: { type: string, description: "Sign in at {supabaseUrl}/auth/v1/token?grant_type=password, sign up at {supabaseUrl}/auth/v1/signup (HTTPS)." }
        supabaseAnonKey: { type: string, description: "The publishable key, sent as the apikey header; not a secret." }
        siteBase: { type: string, description: 'e.g. "https://sentvms.com"; "" if Sentinel Cloud sent none.' }
        checkoutURL: { type: string, description: "POST {plan, interval, success_url, cancel_url} with the account token → {url} (Stripe Checkout)." }
        portalURL: { type: string, description: "POST {return_url} with the account token → {url} (billing portal)." }
        plans: { type: array, items: { $ref: "#/components/schemas/CloudPlan" } }
    CloudPlan:
      type: object
      required: [id, name, month, year, servers, backupGB, days]
      properties:
        id: { type: string, description: "cloud | business" }
        name: { type: string }
        month: { type: number, description: US dollars a month }
        year: { type: number, description: US dollars a year }
        servers: { type: integer }
        backupGB: { type: integer }
        days: { type: integer, description: Days of offsite backup kept }
    CloudLinkAccount:
      type: object
      additionalProperties: false
      required: [accessToken]
      properties:
        accessToken: { type: string, description: "The Sentinel Cloud account's session token (Supabase JWT); used once, never stored." }
    CloudLinkError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: >-
                cloud_sign_in, cloud_server_limit, cloud_already_linked or cloud_unreachable
                (with an account token); conflict or unavailable (code flow); unauthorized.
            message: { type: string, description: One sentence to show. }
            upgradeURL: { type: string, description: 'cloud_server_limit only: where to upgrade the plan; "" if Sentinel Cloud sent none.' }
    CloudSettings:
      type: object
      additionalProperties: false
      properties:
        remote: { type: boolean }
        backup: { type: boolean }
    CloudRemote:
      type: object
      required: [remoteURL, via]
      properties:
        remoteURL: { type: string, nullable: true }
        via: { type: string, nullable: true, enum: [cloud, tunnel] }
    CloudBackupAccess:
      type: object
      required: [token, expiresAt, serverId, baseURL]
      properties:
        token: { type: string, description: "scb_<relayId>_<secret>, read-only, 30 days" }
        expiresAt: { type: string, format: date-time }
        serverId: { type: string }
        baseURL: { type: string, description: "e.g. https://cloud.sentvms.com/v1/backup" }
