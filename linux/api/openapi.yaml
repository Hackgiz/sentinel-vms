          description: Status.
          content: { application/json: { schema: { $ref: "#/components/schemas/SemanticStatus" } } }
  /api/v2/semantic/backfill:
    post:
      tags: [semantic]
      summary: Index the newest events that have no semantic vector yet (ChangeSettings, audited).
      description: |
        Considers the newest 50,000 events with a thumbnail; progress shows
        in the tasks list (kind `semantic`). 201 with a new job, 200 with the
        one already running, 409 when no model is installed.
      responses:
        "200":
          description: The job already running.
          content: { application/json: { schema: { $ref: "#/components/schemas/AppearanceBackfill" } } }
        "201":
          description: The started job.
          content: { application/json: { schema: { $ref: "#/components/schemas/AppearanceBackfill" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [semantic]
      summary: Cancel the running index job (ChangeSettings, audited); vectors stored so far are kept.
      responses:
        "200":
          description: The job.
          content: { application/json: { schema: { $ref: "#/components/schemas/AppearanceBackfill" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v2/events/semantic:
    post:
      tags: [semantic]
      summary: Find events whose snapshot matches a description (ViewLive, audited).
      description: |
        Local image-text search: the text is embedded by the CLIP text
        model, stored snapshot vectors (same model) are ranked by cosine
        similarity, brute force over the candidates pre-filtered by camera
        and time (the newest 200,000 at most). No AI key is needed and
        nothing leaves the server. Results stay within the caller's camera
        scope. 503 when no model is installed (the message says why).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              additionalProperties: false
              properties:
                text: { type: string, minLength: 2, maxLength: 200, example: "red pickup truck backing up" }
                cameras: { type: array, items: { type: string } }
                from: { type: integer, format: int64, description: "Unix ms, inclusive" }
                to: { type: integer, format: int64, description: "Unix ms, exclusive" }
                limit: { type: integer, minimum: 1, maximum: 100, default: 30 }
                minScore: { type: number, minimum: 0, maximum: 1, description: "cosine similarity floor; default 0.2" }
      responses:
        "200":
          description: Matches, best first.
          content:
            application/json:
              schema:
                type: object
                required: [items, model]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/SemanticHit" } }
                  model: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/Unavailable" }
  # ------------------------------------------------------------ talkback ---
  /api/v2/cameras/{cameraId}/talkback:
    get:
      tags: [talkback]
      summary: Talk through the camera's speaker (WebSocket, ONVIF audio backchannel).
      description: |
        Upgrade to a WebSocket and stream the operator's voice to the camera.
        Only for cameras whose payload says `talkback: true` (the server
        probed an ONVIF audio backchannel offering G.711 µ-law). Needs the
        controlPtz permission; camera scope applies; cameras on another
        recording server answer 502. One session per camera: a second one
        answers 409 (or closes with 4409). Start and end are audited with
        the duration.

        Auth as `/api/v2/events/stream`: a bearer header, else the session
        cookie (same-origin `Origin`), else the first client message must be
        `{"type":"auth","accessToken":"..."}` within 10 s. With first-message
        auth the checks run after the upgrade and a refusal is a close code
        instead of an HTTP status.

        After the camera accepts, the server sends
        `{"type":"ready","cameraId","codec":"PCMU/8000","rate","idleTimeoutMs","maxDurationMs"}`.
        The client then sends binary frames of little-endian signed 16-bit
        mono PCM at `rate` Hz; the server encodes G.711 µ-law and relays
        20 ms RTP packets. `{"type":"stop"}` (or closing) hangs up; the camera
        always gets an RTSP TEARDOWN. No audio for 30 s ends the session
        (close 4408); a session lasts at most 5 minutes (close 4410).

        Close codes: 4400 no two-way audio on this camera, 4401 sign-in
        required or ended, 4403 not allowed, 4404 camera not found, 4408
        idle, 4409 someone else is talking through the camera, 4410 time
        limit reached, 4502 the camera refused or dropped the backchannel
        (preceded by `{"type":"error","message"}`).
      parameters:
        - $ref: "#/components/parameters/CameraId"
        - name: rate
          in: query
          description: Sample rate of the PCM the client sends; 16000 is downsampled on the server.
          schema: { type: integer, enum: [8000, 16000], default: 8000 }
      responses:
        "101": { description: Switching to the WebSocket protocol. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/Unavailable" }

  # -------------------------------------------------------- wall-layouts ---
  /api/v2/wall-layouts:
    get:
      tags: [wall-layouts]
