name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the job or site where you needed it.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Sentinel to do?
