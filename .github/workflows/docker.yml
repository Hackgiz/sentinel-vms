# Multi-arch Docker image for the Linux server -> GHCR.
#
# Lives in the public repo (github.com/Hackgiz/sentinel-vms) at
# .github/workflows/docker.yml; scripts/sync-oss.sh copies it there.
# Paths are relative to that repo's root (linux/ = the Go server).
#
# Tag pushes (v1.2.3) build linux/amd64 + linux/arm64 and push
#   ghcr.io/<owner>/sentinel-vms:1.2.3, :1.2, :latest
# A manual run (workflow_dispatch) builds without pushing.
name: Docker image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build (amd64 + arm64) and push to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: linux/web/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version-file: linux/go.mod
          cache-dependency-path: linux/go.sum

      # MediaMTX, cloudflared, ffmpeg, ONNX Runtime and the YOLOX model
      # (~0.6 GB, checksum-pinned in build.sh). Re-downloaded when build.sh's
      # pins change.
      - name: Cache third-party downloads
        uses: actions/cache@v4
        with:
          path: linux/.cache
          key: sentinel-downloads-${{ hashFiles('linux/scripts/build.sh') }}

      - name: Version and image name
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-${GITHUB_SHA::7}"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sentinel-vms" >> "$GITHUB_ENV"

      - name: Build release + Docker context
        run: linux/scripts/build.sh

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,enable=${{ github.ref_type != 'tag' }}

      # No QEMU: the Dockerfile only COPYs pre-built binaries (no RUN steps),
      # so buildx can assemble the arm64 image on an amd64 runner.
      - uses: docker/setup-buildx-action@v3

      - if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: linux/dist/docker
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.VERSION }}
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
