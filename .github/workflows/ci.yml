name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mac:
    name: Mac app (swift build + test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - run: swift build
      - run: swift test

  linux:
    name: Linux server (go test + dashboard build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: linux/web/package-lock.json
      - name: Build dashboard
        working-directory: linux/web
        run: npm ci && npm run build
      - uses: actions/setup-go@v7
        with:
          go-version-file: linux/go.mod
          cache-dependency-path: linux/go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - name: Cross-compile
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/sentinel
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/sentinel
